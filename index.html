<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0F8A7E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232563EB'/%3E%3Cpath d='M30 55 L45 70 L72 35' stroke='white' stroke-width='9' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- jsPDF + autoTable para generación de PDF profesional -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<style>
  /* ===================== SISTEMA DE DISEÑO · CRM PROFESIONAL =====================
     Paleta corporativa (gris/blanco + azul + semáforo de estados), tipografía Inter
     (con fallback a la fuente nativa del sistema si no hay conexión: la app sigue
     funcionando 100% offline, solo pierde el toque exacto de Inter). */
  :root{
    --bg:#F6F8FB; --surface:#FFFFFF; --surface-2:#F0F3F8;
    --ink:#101828; --muted:#667085; --faint:#98A2B3;
    --line:#E4E7EC; --line-strong:#D0D5DD;
    --accent:#2563EB; --accent-ink:#1D4ED8; --accent-soft:#EFF4FF;
    --navy:#101828; --navy-2:#1D2939; --navy-line:#2D3748; --navy-ink:#CBD5E1;
    --amber:#B54708; --amber-soft:#FFF6E9;
    --good:#12805C; --good-soft:#E7F7EF;
    --warn:#B54708; --warn-soft:#FFF6E9;
    --crit:#D92D20; --crit-soft:#FEF0EE;
    --violet:#5925DC; --violet-soft:#EFEAFB;
    --f:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.06);
    --shadow-lg:0 -2px 10px rgba(16,24,40,.05),0 -20px 50px rgba(16,24,40,.12);
    --shadow-card:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
    --radius:14px; --radius-lg:18px;
    --ease:cubic-bezier(.4,0,.2,1);
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
  }
  /* La app usa siempre el tema claro (arriba), independientemente del modo del sistema/navegador. */
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--f);
    font-size:15.5px;line-height:1.5;overscroll-behavior-y:none;
    -webkit-font-smoothing:antialiased;letter-spacing:-.01em}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;transition:transform .12s var(--ease),opacity .12s var(--ease),background-color .15s var(--ease)}
  button:active{transform:scale(.97)}
  input,select{font-family:inherit;font-size:16px}
  h1,h2,h3{font-family:var(--f);letter-spacing:-.02em}
  ::selection{background:var(--accent-soft);color:var(--accent-ink)}
  /* transición discreta al cambiar de vista/pestaña */
  .view{animation:vfade .22s var(--ease)}
  @keyframes vfade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
  .sheet{transition:transform .28s var(--ease)}
  .row,.kpi,.quickbar button,.addbtn{transition:transform .15s var(--ease),box-shadow .15s var(--ease),border-color .15s var(--ease)}
  @media (hover:hover){
    .row[role="button"]:hover,.row[onclick]:hover{box-shadow:var(--shadow-card);border-color:var(--line-strong);transform:translateY(-1px)}
    .quickbar button:hover{background:var(--accent);color:#fff}
    .kpi:hover{box-shadow:0 4px 16px rgba(16,24,40,.08);transform:translateY(-1px)}
  }

  #app{max-width:520px;margin:0 auto;min-height:100%;background:var(--bg);
    display:flex;flex-direction:column;position:relative}

  /* en ordenador: marco de móvil centrado (los overlays fijos se anclan al #app por el transform) */
  @media (min-width:600px){
    body{background:
      radial-gradient(1200px 600px at 50% -10%, color-mix(in srgb,var(--accent) 10%,transparent), transparent 60%),
      var(--bg);
      min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 0}
    #app{width:414px;height:min(880px,calc(100vh - 48px));min-height:0;border-radius:38px;overflow:hidden;
      border:1px solid var(--line-strong);box-shadow:0 30px 90px rgba(20,32,29,.22);
      transform:translateZ(0)}
    #app main{flex:1;overflow-y:auto;overflow-x:hidden}
    .tabbar,.sheet,.sheet-bg,.login,.toast{position:absolute}
    .tabbar{left:0;right:0;max-width:none;transform:none}
    .sheet{left:0;right:0;max-width:none;transform:translateY(100%);max-height:88%}
    .sheet.open{transform:translateY(0)}
    .toast{left:50%;transform:translateX(-50%) translateY(20px)}
    .toast.show{transform:translateX(-50%) translateY(0)}
  }

  /* el admin NUNCA usa el marco de móvil en escritorio: a partir de 600px el panel es fluido.
     Entre 600 y 899px aún no cabe el sidebar lateral, así que mantiene las pestañas en píldora
     pero a ancho completo (antes quedaba atrapado en el marco de móvil en ese rango). */
  @media (min-width:600px){
    body.role-admin{padding:0;display:block;background:var(--bg)}
    body.role-admin #app{width:100%;max-width:1440px;height:auto;min-height:100vh;border-radius:0;
      border:none;box-shadow:none;transform:none;margin:0 auto;overflow:visible}
    body.role-admin #app main{flex:none;overflow:visible}
    body.role-admin .sheet,body.role-admin .sheet-bg,
    body.role-admin .login,body.role-admin .toast{position:fixed}
    /* el admin navega con las pestañas de arriba; la barra inferior de móvil sobra en escritorio */
    body.role-admin .tabbar{display:none}
    body.role-admin .rtpick{display:none!important}
    body.role-admin #viewAdmin{padding:0 20px 40px}
    body.role-admin .adm-tabs{padding-top:12px}
  }

  /* dashboard de administrador en PC: el admin controla, no ejecuta rutas, así que en escritorio
     cambia el marco de móvil por un panel de control ancho con menú lateral fijo */
  @media (min-width:900px){
    body.role-admin{padding:0;display:block;background:var(--bg)}
    body.role-admin #app{width:100%;max-width:1440px;height:auto;min-height:100vh;border-radius:0;
      border:none;box-shadow:none;transform:none;margin:0 auto}
    body.role-admin #app main{overflow:visible}
    body.role-admin #views{padding:0}
    body.role-admin .tabbar{display:none}
    body.role-admin .rtpick{display:none!important}
    body.role-admin .topbar{display:none}
    body.role-admin .sheet,body.role-admin .sheet-bg,body.role-admin .toast{position:fixed}
    body.role-admin .sheet{left:50%;right:auto;top:auto;bottom:0;transform:translate(-50%,100%);
      width:560px;max-width:92vw;border-radius:24px 24px 0 0;max-height:86vh}
    body.role-admin .sheet.open{transform:translate(-50%,0)}
    body.role-admin #viewAdmin{display:block;padding:0;min-height:100vh}
    /* sidebar corporativo azul oscuro, REALMENTE fijo (no sticky): no se mueve nunca, solo #admBody escrolea */
    body.role-admin #viewAdmin .adm-tabs{position:fixed;left:0;top:0;z-index:15;display:flex;flex-direction:column;
      gap:2px;overflow-y:auto;width:240px;height:100vh;padding:0 12px 18px;background:var(--navy);margin:0}
    body.role-admin #viewAdmin .adm-shell-head{display:block;flex:none;padding:20px 12px 16px;margin:0 -12px 10px;border-bottom:1px solid var(--navy-line)}
    body.role-admin #viewAdmin .adm-shell-logo{display:flex;align-items:center;gap:10px;margin-bottom:14px}
    body.role-admin #viewAdmin .adm-shell-logo img{width:32px;height:32px;border-radius:8px;object-fit:cover;flex:none}
    body.role-admin #viewAdmin .adm-shell-logo .n{color:#fff;font-weight:800;font-size:14px;line-height:1.2}
    body.role-admin #viewAdmin .adm-shell-logo .s{color:var(--navy-ink);font-size:11px;font-weight:600}
    body.role-admin #viewAdmin .adm-shell-user{display:flex;align-items:center;gap:9px}
    body.role-admin #viewAdmin .adm-shell-user .av{width:28px;height:28px;border-radius:50%;background:var(--accent);
      color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
    body.role-admin #viewAdmin .adm-shell-user .t{color:#fff;font-size:12.5px;font-weight:700}
    body.role-admin #viewAdmin .adm-shell-user .r{color:var(--navy-ink);font-size:10.5px}
    body.role-admin #viewAdmin .adm-shell-user button{margin-left:auto;background:transparent;border:none;color:var(--navy-ink);padding:4px}
    body.role-admin #viewAdmin .adm-tabs button{text-align:left;border-radius:9px;padding:10px 13px;
      background:transparent;border-color:transparent;color:var(--navy-ink);font-weight:600;font-size:13.5px;flex:none}
    body.role-admin #viewAdmin .adm-tabs button:hover{background:var(--navy-2);color:#fff}
    body.role-admin #viewAdmin .adm-tabs button.on{background:var(--accent);color:#fff;border-color:transparent}
    body.role-admin #viewAdmin #admBody{margin-left:240px;min-height:100vh;overflow-y:auto;padding:28px 36px 60px;max-width:1120px}
  }

  /* top bar */
  .topbar{position:sticky;top:0;z-index:20;padding:calc(var(--safe-t) + 12px) 18px 12px;
    background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;justify-content:space-between}
  .topbar .tt{font-weight:800;font-size:19px;letter-spacing:-.01em}
  .topbar .ts{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.09em;font-weight:700}
  .rtpick{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);
    border-radius:999px;padding:6px 8px 6px 13px;font-weight:700;font-size:13px;box-shadow:var(--shadow)}
  .rtpick select{border:none;background:none;font-weight:700;color:var(--ink);max-width:130px}
  .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(160deg,var(--accent-soft),color-mix(in srgb,var(--accent-soft) 55%,transparent));
    color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;
    box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 30%,transparent)}
  .av svg{width:18px;height:18px}

  main{flex:1;padding:16px 18px 108px}
  .hidden{display:none!important}

  /* KPIs */
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
  @media (min-width:900px){ .kpis{grid-template-columns:repeat(4,1fr)} }
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 17px;box-shadow:var(--shadow-card)}
  .kpi .n{font-weight:800;font-size:25px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .kpi .l{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.25;font-weight:600}
  .kpi.warnk .n{color:var(--warn)}
  .kpi.kpi-good .kpi-ic{background:var(--good-soft);color:var(--good)}
  .kpi.kpi-warn .kpi-ic{background:var(--warn-soft);color:var(--warn)}
  .kpi.kpi-crit .kpi-ic{background:var(--crit-soft);color:var(--crit)}
  .kpi.big{grid-column:span 2;background:linear-gradient(135deg,var(--accent),var(--accent-ink));border-color:transparent}
  .kpi.big .n{font-size:32px;color:#fff}
  .kpi.big .l{color:rgba(255,255,255,.85)}
  .kpi-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .kpi-ic{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;flex:none}
  .kpi-delta{display:flex;align-items:center;gap:2px;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:999px}
  .kpi-delta.up{background:var(--good-soft);color:var(--good)}
  .kpi-delta.down{background:var(--crit-soft);color:var(--crit)}
  .kpi-delta.flat{background:var(--surface-2);color:var(--muted)}
  /* tabla moderna (solo escritorio; en móvil se ven las tarjetas .row de siempre) */
  .dtable-wrap{display:none}
  .dtable{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .dtable th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);
    padding:12px 16px;background:var(--surface-2);border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
  .dtable th:hover{color:var(--accent-ink)}
  .dtable th .sic{opacity:.4;margin-left:3px}
  .dtable th.sorted .sic{opacity:1;color:var(--accent)}
  .dtable td{padding:13px 16px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
  .dtable tbody tr{transition:background-color .12s var(--ease)}
  .dtable tbody tr:hover{background:var(--accent-soft)}
  .dtable tbody tr:last-child td{border-bottom:none}
  .search-wrap{position:relative;margin-bottom:12px}
  .search-wrap .sic-input{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
  .search-wrap input{padding-left:38px}
  @media (min-width:900px){
    .dtable-wrap{display:block;overflow-x:auto;margin-bottom:14px}
    .cards-wrap.has-table{display:none}
  }
  /* tarjetas de gráfico */
  .chart-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-card);margin-bottom:14px}
  .chart-card h3{margin:0 0 14px;font-size:14.5px;font-weight:700;color:var(--ink)}
  .charts-grid{display:grid;grid-template-columns:1fr;gap:14px}
  @media (min-width:900px){ .charts-grid{grid-template-columns:1.3fr 1fr} }

  .sec-t{font-size:12px;color:var(--faint);text-transform:uppercase;letter-spacing:.1em;
    font-weight:800;margin:22px 2px 10px;display:flex;justify-content:space-between;align-items:center}
  .sec-t .cnt{color:var(--muted)}

  /* client card */
  .cli{display:flex;align-items:stretch;gap:11px;padding:12px;border-radius:15px;
    border:1px solid var(--line);background:var(--surface);margin-bottom:9px;box-shadow:var(--shadow);
    transition:transform .08s}
  .cli:active{transform:scale(.99)}
  .cli .stbar{width:4px;border-radius:4px;background:var(--line-strong);flex:none}
  .cli.e-pendiente .stbar,.cli.hered .stbar{background:var(--warn)}
  .cli.hered{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:var(--warn-soft)}
  .cli.mot-incid{border-color:color-mix(in srgb,var(--crit) 50%,var(--line));background:var(--crit-soft)}
  .cli.mot-incid .stbar{background:var(--crit)}
  .cli.e-realizada .stbar{background:var(--good)}
  .cli.e-cerrado .stbar{background:var(--faint)}
  .cli.e-ausente:not(.hered) .stbar{background:var(--faint)}
  .cli.e-incidencia .stbar{background:var(--crit)}
  .cli .mid{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
  .cli .nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cli .ad{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .cli .rt{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:4px;flex:none}
  .cli .amt{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
  .mtag{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:3px 7px;border-radius:6px;white-space:nowrap}
  .mt-warn{background:var(--warn-soft);color:var(--warn)}
  .mt-good{background:var(--good-soft);color:var(--good)}
  .mt-crit{background:var(--crit-soft);color:var(--crit)}
  .mt-neutral{background:var(--surface-2);color:var(--faint)}
  .mt-acc{background:var(--accent-soft);color:var(--accent-ink)}
  .mt-vio{background:var(--violet-soft);color:var(--violet)}
  .mt-amb{background:var(--amber-soft);color:var(--amber)}
  button.mtag{border:none;cursor:pointer;font:inherit;font-weight:800}
  .mapbtn{width:38px;height:38px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line);
    font-size:17px;display:grid;place-items:center;flex:none}
  .mapbtn:active{transform:scale(.92)}
  .gasto-foto{width:46px;height:46px;border-radius:10px;object-fit:cover;flex:none;cursor:pointer;border:1px solid var(--line)}
  .gasto-noimg{width:46px;height:46px;border-radius:10px;flex:none;display:grid;place-items:center;
    font-size:22px;background:var(--surface-2);border:1px solid var(--line)}
  .gasto-preview{width:100%;max-height:220px;object-fit:contain;border-radius:12px;border:1px solid var(--line);
    background:var(--surface-2);margin-top:4px;display:block}
  .devrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px;
    border:1px solid var(--line);border-radius:12px;margin-top:8px;background:var(--surface)}
  .devrow.act{border-color:var(--accent);background:var(--accent-soft)}
  .devrow .dl{font-weight:700;font-size:14px}
  .devrow .ds{font-size:12px;color:var(--muted);margin-top:1px}
  .stepper{display:flex;align-items:center;gap:0;flex:none}
  .stepper button{width:34px;height:34px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);
    font-size:20px;font-weight:800;color:var(--accent-ink);display:grid;place-items:center}
  .stepper button:active{transform:scale(.9)}
  .stepper .cnt{min-width:30px;text-align:center;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
  .filtros{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
  .filtros .ff{display:flex;flex-direction:column;gap:3px}
  .filtros label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .filtros select,.filtros input{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--surface);color:var(--ink);font-size:14px}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cal-title{font-family:inherit;font-weight:800;font-size:16px;text-transform:capitalize}
  .cal-nav{width:38px;height:38px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:20px;font-weight:800;color:var(--accent-ink)}
  .cal-dows{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
  .cal-dows span{text-align:center;font-size:11px;font-weight:800;color:var(--faint)}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal-cell{min-height:52px;border-radius:9px;border:1px solid var(--line);background:var(--surface);padding:4px;display:flex;flex-direction:column;gap:2px}
  .cal-cell.empty{border:none;background:transparent}
  .cal-cell.has{cursor:pointer}
  .cal-cell.hoy{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .cal-num{font-size:12px;font-weight:700;color:var(--muted)}
  .cal-chips{display:flex;flex-wrap:wrap;gap:2px}
  .cal-chip{font-size:9px;font-weight:800;background:var(--accent-soft);color:var(--accent-ink);border-radius:4px;padding:1px 4px}
  .cal-chip.cal-inc{background:var(--crit-soft);color:var(--crit)}
  .cal-chip.cal-lic{background:var(--violet-soft);color:var(--violet)}
  .cal-chip.cal-ren{background:var(--warn-soft);color:var(--warn)}
  .cal-chip.cal-eve{background:var(--good-soft);color:var(--good)}
  .cal-chip.late{background:var(--crit-soft);color:var(--crit)}
  .ctable-wrap{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
  .ctable{width:100%;border-collapse:collapse;font-size:14px}
  .ctable th,.ctable td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line)}
  .ctable th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800;background:var(--surface-2)}
  .ctable td{font-weight:600}
  .ctable td.num,.ctable th.num{text-align:right;font-variant-numeric:tabular-nums}
  .ctable tbody tr:last-child td{border-bottom:none}
  .ctable tfoot td{font-weight:800;background:var(--surface-2);border-top:2px solid var(--line-strong);border-bottom:none}
  /* ficha 360º de cliente */
  .fc-head{display:flex;align-items:center;gap:14px;margin-bottom:6px}
  .fc-avatar{width:48px;height:48px;border-radius:12px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;flex:none}
  .fc-tabs-actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 18px}
  .fc-block{border-top:1px solid var(--line);padding:16px 0}
  .fc-block:first-of-type{border-top:none;padding-top:0}
  .fc-block-h{display:flex;align-items:center;gap:8px;color:var(--accent-ink);margin-bottom:10px}
  .fc-block-h h4{margin:0;font-size:13.5px;font-weight:700;color:var(--ink);text-transform:uppercase;letter-spacing:.03em}
  .fc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
  .fc-grid div{display:flex;flex-direction:column;gap:3px}
  .fc-grid span{font-size:11.5px;color:var(--muted);font-weight:600}
  .fc-grid b{font-size:13.5px;font-weight:600}
  .tec-cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-bottom:14px}
  .tec-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 17px;box-shadow:var(--shadow-card)}
  .tec-card .fc-block-h{margin-bottom:10px}
  .tec-card .fc-block-h h4{flex:1}
  .tec-card .rx{color:var(--faint);padding:4px 6px;border-radius:8px}
  .tec-card .rx:hover{background:var(--surface-2);color:var(--ink)}
  .fc-stat-n{font-weight:800;font-size:20px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .fc-stat-l{font-size:11.5px;color:var(--muted);margin-top:4px;font-weight:600}
  .fc-chips{display:flex;flex-wrap:wrap;gap:6px}
  .fc-list{display:flex;flex-direction:column;gap:8px}
  .fc-list-row{display:flex;align-items:center;gap:10px;font-size:13px;padding:8px 10px;background:var(--surface-2);border-radius:9px}
  .fc-empty{color:var(--faint);font-size:13px;margin:0}
  .aromawrap{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
  .aromachip{display:inline-flex;align-items:center;gap:8px;background:var(--violet-soft);color:var(--violet);
    border-radius:999px;padding:7px 8px 7px 13px;font-weight:700;font-size:13px}
  .aromachip b{background:color-mix(in srgb,var(--violet) 22%,transparent);border-radius:999px;padding:0 6px;font-size:11px}
  .aromachip button{width:22px;height:22px;border-radius:50%;background:color-mix(in srgb,var(--violet) 18%,transparent);
    color:var(--violet);font-weight:800;font-size:12px;display:grid;place-items:center;line-height:1}
  .aroma-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .ab{padding:11px 16px;border-radius:12px;font-weight:800;font-size:14px;
    border:1.5px solid var(--line);background:var(--surface-2);color:var(--muted)}
  .ab.on{background:var(--accent);color:#fff;border-color:var(--accent)}

  .quick{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:2px 0 0}
  .qb{border-radius:12px;padding:10px 2px;text-align:center;font-size:11px;font-weight:800;
    border:1px solid var(--line);background:var(--surface-2);color:var(--muted)}
  .qb .qi{font-size:19px;display:block;margin-bottom:2px}
  .qb.g{background:var(--good-soft);color:var(--good);border-color:transparent}
  .qb.i{background:var(--crit-soft);color:var(--crit);border-color:transparent}
  .qb:active{transform:scale(.95)}
  .cli-wrap{margin-bottom:9px}
  .cli-wrap .cli{margin-bottom:7px}
  .draghandle{display:flex;align-items:center;justify-content:center;flex:none;width:34px;align-self:stretch;
    font-size:19px;color:var(--faint);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
  .draghandle:active{cursor:grabbing;color:var(--accent)}
  .cli-wrap.dragging{opacity:.55}
  .cli-wrap.dragging .cli{border-color:var(--accent);box-shadow:0 10px 28px rgba(20,32,29,.18)}
  .assignbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);
    border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:14px;box-shadow:var(--shadow)}
  .assignbar .al{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .assignbar select{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface-2);
    color:var(--ink);font-weight:700;font-size:14px;max-width:55%}

  /* bottom tabs */
  .tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;
    display:flex;background:var(--surface);
    border-top:1px solid var(--line);padding-bottom:var(--safe-b);z-index:30;box-shadow:0 -4px 20px rgba(0,0,0,.04)}
  /* nº de pestañas variable según el rol: flex en vez de grid fijo para que nunca se descuadre ni se caiga a otra fila */
  .tab{flex:1 1 0;min-width:0;padding:10px 2px 9px;text-align:center;font-size:10px;font-weight:700;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tab .ti{font-size:20px;display:flex;justify-content:center;margin-bottom:2px;line-height:1}
  .tab.on{color:var(--accent)}
  .tab .badge{position:absolute;margin-left:12px;margin-top:-4px;background:var(--crit);color:#fff;
    font-size:9px;font-weight:800;padding:1px 5px;border-radius:999px}

  /* sheet / modal */
  .sheet-bg{position:fixed;inset:0;background:rgba(10,20,17,.5);z-index:40;
    opacity:0;pointer-events:none;transition:opacity .2s}
  .sheet-bg.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:520px;
    background:var(--surface);border-radius:22px 22px 0 0;z-index:41;transition:transform .28s cubic-bezier(.2,.8,.2,1);
    max-height:92vh;overflow-y:auto;padding:8px 18px calc(24px + var(--safe-b));box-shadow:var(--shadow-lg)}
  .sheet.open{transform:translate(-50%,0)}
  .grab{width:38px;height:4px;border-radius:4px;background:var(--line-strong);margin:8px auto 12px}
  .sheet h2{font-size:20px;margin:0 0 2px;letter-spacing:-.01em}
  .sheet .sub{color:var(--muted);font-size:13px;margin:0 0 16px}

  .ask-q{font-weight:800;font-size:21px;text-align:center;margin:10px 0 16px}
  .yn{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .yn button{padding:22px 0;border-radius:16px;font-weight:800;font-size:18px}
  .yn .yes{background:var(--good);color:#fff}
  .yn .no{background:var(--surface-2);border:1px solid var(--line-strong);color:var(--muted)}

  .field{margin-top:12px}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;
    letter-spacing:.07em;margin-bottom:7px}
  .amtbox{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);
    border-radius:14px;padding:6px 14px}
  .amtbox input{border:none;background:none;font-size:26px;font-weight:800;width:100%;color:var(--ink);
    font-variant-numeric:tabular-nums}
  .amtbox .cur{font-size:22px;font-weight:800;color:var(--muted)}
  .seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .seg button{padding:14px 4px;border-radius:13px;font-size:13px;font-weight:800;
    border:1.5px solid var(--line);background:var(--surface-2);color:var(--muted);display:flex;flex-direction:column;gap:4px;align-items:center}
  .seg button .si{font-size:18px}
  .seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .seg.two{grid-template-columns:1fr 1fr}

  .tog{display:flex;align-items:center;justify-content:space-between;padding:14px;border:1px solid var(--line);
    border-radius:14px;margin-top:9px;font-weight:700;font-size:14px;background:var(--surface)}
  .tog .lab{display:flex;align-items:center;gap:10px}
  .sw{width:46px;height:28px;border-radius:999px;background:var(--line-strong);position:relative;flex:none;transition:background .15s}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
    background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .tog.on .sw{background:var(--accent)}
  .tog.on .sw::after{left:21px}
  .expand{max-height:0;overflow:hidden;transition:max-height .2s ease}
  .expand.open{max-height:280px}
  .txt{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:var(--surface-2);
    color:var(--ink);margin-top:8px;font-size:15px}

  .cta{width:100%;margin-top:20px;padding:17px;border-radius:16px;background:var(--accent);color:#fff;
    font-weight:800;font-size:17px;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 40%,transparent)}
  .cta:active{transform:scale(.99)}
  .cta.ghost{background:var(--surface-2);color:var(--muted);box-shadow:none;border:1px solid var(--line)}
  .cta.warn{background:var(--warn)}
  .cta.crit{background:var(--crit);box-shadow:none}
  .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  /* cierre summary */
  .sumcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px 18px;box-shadow:var(--shadow)}
  .suml{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-top:1px solid var(--line);font-size:15px}
  .suml:first-child{border-top:none}
  .suml .sl{color:var(--muted);display:flex;align-items:center;gap:9px}
  .suml .sv{font-weight:800;font-variant-numeric:tabular-nums}
  .suml .sv.warn{color:var(--warn)} .suml .sv.crit{color:var(--crit)} .suml .sv.good{color:var(--good)}
  .prodcard{margin-top:12px;background:linear-gradient(135deg,var(--accent),var(--accent-ink));
    border-radius:18px;padding:20px;color:#fff;display:flex;justify-content:space-between;align-items:center}
  .prodcard .pl{font-size:13px;opacity:.9} .prodcard .pv{font-weight:800;font-size:30px;font-variant-numeric:tabular-nums}

  /* iconografía */
  .ic{flex:none;display:inline-block;vertical-align:-3px}
  .mtag{display:inline-flex;align-items:center;gap:4px}
  .mtag .ic{vertical-align:middle}
  /* admin */
  .adm-tabs{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto}
  /* la cabecera con logo/empresa/usuario solo tiene sentido con el sidebar vertical (>=900px) */
  .adm-shell-head{display:none}
  .adm-tabs button{display:flex;align-items:center;gap:8px;padding:8px 15px;border-radius:999px;font-weight:700;font-size:13px;
    background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .adm-tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}

  /* Selector de navegación móvil de Administración */
  .adm-mobile-nav{display:block;margin-bottom:16px}
  .adm-nav-dropdown{width:100%;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;
    background:var(--surface);border:1.5px solid var(--line-strong);border-radius:16px;box-shadow:var(--shadow-sm);
    cursor:pointer;transition:transform .15s var(--ease),border-color .15s var(--ease);color:var(--ink)}
  .adm-nav-dropdown:active{transform:scale(.98)}
  .adm-nav-dropdown .sec-left{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15.5px;color:var(--ink)}
  .adm-nav-dropdown .sec-left .ic-box{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
  .adm-nav-dropdown .sec-right{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;font-size:12.5px;box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 30%,transparent)}

  /* Modal de menú a pantalla completa (full-screen overlay) */
  .adm-menu-overlay{position:fixed;inset:0;z-index:100;background:rgba(15,23,42,0.65);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .25s var(--ease)}
  .adm-menu-overlay.open{opacity:1;pointer-events:auto}
  .adm-menu-modal{background:var(--bg);width:100%;height:100%;max-width:100%;display:flex;flex-direction:column;overflow-y:auto;
    padding:calc(var(--safe-t) + 16px) 20px 40px;box-sizing:border-box;animation:slideUp .3s var(--ease)}
  .adm-menu-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--line)}
  .adm-menu-head h2{font-size:22px;font-weight:800;margin:0;color:var(--ink);letter-spacing:-0.01em}
  .adm-menu-head p{font-size:13px;color:var(--muted);margin:3px 0 0}
  .adm-menu-close{width:40px;height:40px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);
    display:grid;place-items:center;cursor:pointer;flex:none;transition:transform .15s,background .15s}
  .adm-menu-close:active{transform:scale(.92)}
  .adm-menu-grid{display:grid;grid-template-columns:1fr;gap:11px}
  @media (min-width:540px){.adm-menu-grid{grid-template-columns:repeat(2,1fr)}}
  @media (min-width:800px){.adm-menu-grid{grid-template-columns:repeat(3,1fr)}}
  .adm-menu-card{display:flex;align-items:center;gap:14px;padding:15px;background:var(--surface);border:1.5px solid var(--line);
    border-radius:16px;text-align:left;cursor:pointer;box-shadow:var(--shadow-sm);transition:transform .15s var(--ease),border-color .15s var(--ease),box-shadow .15s var(--ease);position:relative}
  .adm-menu-card:active{transform:scale(.98)}
  .adm-menu-card.active{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 20%,transparent)}
  .adm-menu-icon{width:44px;height:44px;border-radius:12px;background:var(--surface-2);color:var(--accent);display:grid;place-items:center;flex:none}
  .adm-menu-card.active .adm-menu-icon{background:var(--accent);color:#fff}
  .adm-menu-info{flex:1;min-width:0}
  .adm-menu-title{font-weight:800;font-size:15px;color:var(--ink)}
  .adm-menu-desc{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35}
  .adm-menu-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:999px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;flex:none}

  /* barra de accesos rápidos: centrado simétrico en móvil */
  .quickbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .quickbar button{display:flex;align-items:center;gap:7px;padding:10px 14px;border-radius:12px;
    background:var(--accent-soft);color:var(--accent-ink);font-weight:700;font-size:13px;border:1px solid transparent;transition:transform .15s var(--ease),background .15s var(--ease)}
  .quickbar .qi{font-size:15px;display:flex}
  @media (max-width:899px){
    .adm-tabs{display:none!important}
    .quickbar{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px;width:100%}
    .quickbar button{justify-content:center;text-align:center;padding:13px 10px;width:100%;font-size:13.5px;border-radius:14px;box-shadow:var(--shadow-sm)}
    .quickbar button:active{transform:scale(.97)}
  }
  @media (min-width:900px){
    .adm-mobile-nav{display:none!important}
    .adm-tabs{display:flex!important}
  }

  /* botones corporativos de compartir documentos */
  .btn-share-email{background:var(--navy);color:#fff;border-radius:10px;padding:10px 16px;font-weight:700;font-size:13.5px;border:none;display:inline-flex;align-items:center;gap:7px;cursor:pointer}
  .btn-share-msg{background:var(--accent);color:#fff;border-radius:10px;padding:10px 16px;font-weight:700;font-size:13.5px;border:none;display:inline-flex;align-items:center;gap:7px;cursor:pointer}
  .row{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--surface);
    border:1px solid var(--line);border-radius:14px;margin-bottom:8px;box-shadow:var(--shadow)}
  .row .ri{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent-ink);
    display:grid;place-items:center;font-weight:800;flex:none}
  .row .rm{flex:1;min-width:0}
  .row .rn{font-weight:700;font-size:15px}
  .row .rd{font-size:12.5px;color:var(--muted)}
  .row .rx{font-size:20px;color:var(--faint);padding:4px 8px}
  .addbtn{width:100%;padding:14px;border-radius:14px;border:1.5px dashed var(--line-strong);
    color:var(--accent);font-weight:800;background:var(--surface-2);margin-top:4px}
  .empty{text-align:center;color:var(--faint);padding:40px 20px;font-size:14px}
  .empty .ei{font-size:40px;display:block;margin-bottom:10px}

  /* dashboard admin */
  .prog{height:8px;border-radius:8px;background:var(--surface-2);overflow:hidden;margin-top:7px}
  .prog i{display:block;height:100%;background:var(--accent);border-radius:8px}

  /* login / perfil */
  .login{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;align-items:center;
    justify-content:center;padding:28px;padding-top:calc(var(--safe-t) + 28px)}
  .login-card{max-width:440px;width:100%;text-align:center}
  .login-logo{max-width:260px;width:70%;height:auto;margin:0 auto 10px;display:block}
  .login-card h1{font-size:26px;letter-spacing:.03em;margin:0 0 2px}
  .login-card>p{color:var(--muted);margin:0 0 26px}
  .login-btn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);
    border:1px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
  .login-btn>span{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
    background:var(--accent-soft);color:var(--accent-ink)}
  .login-btn>span svg{width:21px;height:21px}
  .login-btn .av2{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);
    display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;
    box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 30%,transparent)}
  .login-btn b{display:block;font-size:16px}
  .login-btn small{color:var(--muted);font-size:12.5px;display:block;margin-top:2px}
  .login-btn.admin{background:linear-gradient(135deg,var(--accent),var(--accent-ink));border-color:transparent;color:#fff}
  .login-btn.admin>span{background:rgba(255,255,255,.18);color:#fff}
  .login-btn.admin small{color:rgba(255,255,255,.85)}
  .login-btn:active{transform:scale(.99)}
  .login-sep{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.12em;
    font-weight:800;margin:18px 0 12px;text-align:left}
  .av{cursor:pointer}

  .toast{position:fixed;bottom:calc(84px + var(--safe-b));left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;font-weight:700;font-size:14px;
    z-index:60;opacity:0;transition:.25s;box-shadow:var(--shadow);pointer-events:none;max-width:90%}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .fld-inp{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface);
    color:var(--ink);font-size:15px;transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
  .fld-inp:hover{border-color:var(--line-strong)}
  .fld-inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .mini-lbl{font-size:12.5px;font-weight:700;color:var(--muted);margin:16px 0 7px;display:block;letter-spacing:.01em}
  .fld-inp:first-of-type,form>.mini-lbl:first-child{margin-top:0}
  .sheet .mini-lbl:first-of-type{margin-top:4px}
  select.fld-inp{appearance:none}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div>
      <div class="ts" id="tbDate">—</div>
      <div class="tt" id="tbTitle">AMBIÉNTATE</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="rtpick" id="rtpickWrap">
        <span>🚚</span>
        <select id="rutaSel"></select>
      </div>
      <div class="av" id="tbAv">–</div>
    </div>
  </div>

  <main id="views">
    <section id="viewInicio" class="view" role="region" aria-label="Ruta de hoy"></section>
    <section id="viewClientes" class="view hidden" role="region" aria-label="Clientes"></section>
    <section id="viewCaja" class="view hidden" role="region" aria-label="Jornada laboral"></section>
    <section id="viewHistorico" class="view hidden" role="region" aria-label="Histórico"></section>

<script>
"use strict";
/* ---- diagnóstico: captura errores JS y los muestra en pantalla ---- */
window.onerror = function(msg, src, line, col, err) {
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#D92D20;color:#fff;padding:16px 20px;font:14px/1.5 monospace;white-space:pre-wrap;word-break:break-all';
  d.textContent = '❌ ERROR JS:\n' + msg + '\nLínea: ' + line + ', Col: ' + col + '\n' + (err && err.stack ? err.stack : '');
  document.body.prepend(d);
};

/* ---- CAPA API: comunicación con el backend SQLite ---- */
const API_BASE = location.protocol === 'file:' ? 'http://localhost:4000' : location.origin;
let _syncTimer = null;
let _serverAvailable = false; // se pone a true si el primer fetch funciona

async function apiFetch(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  try {
    const res = await fetch(API_BASE + path, opts);
    if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
    return await res.json();
  } catch (err) {
    console.warn('API offline:', err.message);
    return null;
  }
}

async function syncToServer() {
  if (!_serverAvailable) return;
  const result = await apiFetch('POST', '/api/state', S);
  if (result) console.log('✓ Sincronizado con servidor');
}

async function loadFromServer() {
  const state = await apiFetch('GET', '/api/state');
  if (state && state.tecnicos) {
    _serverAvailable = true;
    return state;
  }
  return null;
}

/* ==================== AMBIÉNTATE · App de rutas · MVP ==================== */
const LS_KEY = "ambientate_v1";
const EUR = n => (Math.round(n*100)/100).toLocaleString("es-ES",{minimumFractionDigits:0,maximumFractionDigits:2}) + " €";
const todayISO = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const fmtDate = iso => {
  const d = new Date(iso+"T00:00:00");
  return d.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"});
};
// fecha corta para etiquetas pequeñas: "lun 17 ago"
const fmtDateCorta = iso => {
  if(!iso) return "";
  const d = new Date(iso+"T00:00:00");
  return d.toLocaleDateString("es-ES",{weekday:"short",day:"numeric",month:"short"}).replace(".","");
};
// UTC-safe: evita que el cambio de día se revierta por la zona horaria
const addDays = (iso,n) => { const d=new Date(iso+"T00:00:00Z"); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };
const nextDay = iso => addDays(iso,1);
const uid = () => Math.random().toString(36).slice(2,9);
const inits = s => s.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
// Seguridad: escapa texto controlable por el usuario antes de insertarlo con innerHTML (evita XSS almacenado)
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
// Accesibilidad: activa con Enter/Espacio los elementos con role="button" (tarjetas, filas)
function kb(ev){ if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); ev.currentTarget.click(); } }

/* catálogo de aromas disponibles */
const DEFAULT_AROMAS = ["Skull","Canela","Mango","Infantil","Azahar"];
/* familias/categorías de aroma y formatos de producto (para precio de compra y margen) */
const CATEGORIAS_AROMA = ["Florales","Perfume masculino","Perfume femenino","Frutales","Limpieza","Naturales","Relajantes","Energizantes","Otros"];
const CATEGORIAS_GASTO = ["Combustible","Peajes","Material","Mantenimiento vehículo","Otros"];
const FORMATOS_PRODUCTO = ["Litro nebulización","Bote hidroalcohólico","Bacteriostático"];

/* sectores de cliente por defecto (para que todos los clientes usen los mismos) */
const DEFAULT_SECTORES = ["Hostelería","Tienda/Comercio","Oficina","Clínica/Sanitario","Peluquería/Estética","Gimnasio/Deporte","Educación","Industria/Almacén","Otros"];

/* IVA: todos los importes se muestran con IVA salvo clientes "nota de trabajo" */
const IVA = 0.21;
const conIVA = n => (n||0) * (1+IVA);
const EURI = n => EUR(conIVA(n));
// importe a mostrar a un cliente concreto: con IVA salvo que sea nota de trabajo
const EURcli = (n,c) => (c && c.notaTrabajo) ? EUR(n) + " (s/IVA)" : EURI(n);

/* dispositivos: consumo por servicio + precio de instalación (sin IVA). Editable (S.dispositivos); esto es solo el catálogo de fábrica. */
const DISPOSITIVOS_DEFAULT = [
  {id:"HIDRO 1", label:"Hidro 1", unidad:"bote", cantidad:1, bacterio:false, precio:13},
  {id:"NEBU 1", label:"Nebu 1", unidad:"ml", cantidad:100, bacterio:false, precio:18},
  {id:"NEBU 1.5", label:"Nebu 1.5", unidad:"ml", cantidad:150, bacterio:false, precio:25},
  {id:"NEBU 2", label:"Nebu 2", unidad:"ml", cantidad:200, bacterio:false, precio:30},
  {id:"NEBU 5", label:"Nebu 5", unidad:"ml", cantidad:500, bacterio:false, precio:60},
  {id:"TURBO", label:"Turbo", unidad:"ml", cantidad:150, bacterio:false, precio:15},
  {id:"BACTERIOSTATICO 1", label:"Bacteriostático 1", unidad:"bote", cantidad:1, bacterio:true, precio:0},
];
function DISPOSITIVOS_(){ return (S&&S.dispositivos&&S.dispositivos.length)?S.dispositivos:DISPOSITIVOS_DEFAULT; }
function disp(id){ const list=DISPOSITIVOS_(); return list.find(d=>d.id===id) || list[3]; } // por defecto Nebu 2
const DEFAULT_EMPRESA = {razonSocial:"AMBIÉNTATE Aromatización S.L.", cif:"B-12345678", direccion:"Polígono Industrial La Red, Nave 7 · 41500 Alcalá de Guadaíra, Sevilla",
  telefono:"954 123 456", email:"info@ambientate.es", web:"www.ambientate.es", logo:"logo.png"};
// catálogo de productos para venta adicional (distinto del catálogo de dispositivos)
const VENTA_PRODUCTOS = [
  {id:"turbo", nombre:"Turbo", importe:15},
  {id:"bote100x25", nombre:"Botes 100 ml (caja 25 uds., mínimo 25 uds.)", importe:93.75},
];
// importe base (sin IVA) de la cuota de un cliente = Σ precio dispositivos − descuento
function importeBase(c){
  const bruto = clienteDisps(c).reduce((s,id)=>s+disp(id).precio,0);
  const desc = bruto * ((c && c.descuentoPct)||0)/100;
  return Math.max(0, Math.round((bruto-desc)*100)/100);
}
// lista de dispositivos de un cliente (soporta varios, incluso repetidos)
function clienteDisps(c){
  if(c && Array.isArray(c.dispositivos) && c.dispositivos.length) return c.dispositivos;
  if(c && c.dispositivo) return [c.dispositivo]; // compat modelo antiguo (1 dispositivo)
  return ["NEBU 2"];
}
// resumen legible de dispositivos: "2× Nebu 2, Bacteriostático 1"
function dispResumen(c){
  const cnt={}; clienteDisps(c).forEach(id=>cnt[id]=(cnt[id]||0)+1);
  return Object.keys(cnt).map(id=>(cnt[id]>1?cnt[id]+"× ":"")+disp(id).label).join(", ")||"—";
}
// consumo (lista de entradas) de una visita realizada: una por dispositivo
function consumoVisita(v){
  if(v.estado!=="realizada") return [];
  if(v.consumo) return Array.isArray(v.consumo)?v.consumo:[v.consumo]; // snapshot (compat)
  const c=cliente(v.clienteId); if(!c) return [];
  const aroma = v.cambioAroma||c.aroma||"Sin aroma";
  return clienteDisps(c).map(id=>{ const d=disp(id);
    return {dispositivo:d.id, producto:d.bacterio?"Bacteriostático":aroma, unidad:d.unidad, cantidad:d.cantidad}; });
}
// agrega consumo por producto -> {ml, bote}
function agregarConsumo(visitas){
  const map={};
  (visitas||[]).forEach(v=>{ consumoVisita(v).forEach(co=>{
    (map[co.producto]=map[co.producto]||{ml:0,bote:0})[co.unidad]+=co.cantidad; }); });
  return map;
}
// map de consumo de un cliente por visita (para vista previa en la ficha), con un aroma dado
function consumoPreview(c, aroma){
  const map={};
  clienteDisps(c).forEach(id=>{ const d=disp(id); const prod=d.bacterio?"Bacteriostático":(aroma||"—");
    (map[prod]=map[prod]||{ml:0,bote:0})[d.unidad]+=d.cantidad; });
  return Object.keys(map).map(k=>fmtConsumo(map[k])+" de "+k).join("  +  ")||"—";
}
// toda la app trabaja en mililitros puros (sin conversión a litros) para evitar errores de redondeo
function fmtConsumo(e){
  const p=[];
  if(e.ml) p.push(e.ml+" ml");
  if(e.bote) p.push(e.bote+" bote"+(e.bote>1?"s":""));
  return p.join(" · ")||"—";
}
// coste de compra por ml de un aroma, derivado del precio por litro de nebulización ya cargado en S.aromaCompra
function costePorMl(aroma){
  const compraLitro = (S.aromaCompra[aroma]&&S.aromaCompra[aroma]["Litro nebulización"])||0;
  return compraLitro/1000;
}
function costeAromaMl(aroma, ml){ return (ml||0)*costePorMl(aroma); }
// consumo total en ml de un cliente en un rango de fechas (recorre sus jornadas realizadas)
function consumoClienteRango(c, desde, hasta){
  let ml=0;
  Object.values(S.jornadas).forEach(j=>{
    if(j.fecha<desde || j.fecha>hasta) return;
    const v=j.visitas.find(x=>x.clienteId===c.id); if(!v) return;
    consumoVisita(v).forEach(co=>{ if(co.unidad==="ml") ml+=co.cantidad; });
  });
  return ml;
}
function consumoMensualCliente(c){ return consumoClienteRango(c, inicioMes(S.fecha), S.fecha); }
function consumoAnualCliente(c){ return consumoClienteRango(c, addDays(S.fecha,-365), S.fecha); }
// coste real de aroma consumido por un cliente en un rango (recorre sus visitas y aplica el coste por ml de cada aroma usado)
function costeAromaClienteRango(c, desde, hasta){
  let coste=0;
  Object.values(S.jornadas).forEach(j=>{
    if(j.fecha<desde || j.fecha>hasta) return;
    const v=j.visitas.find(x=>x.clienteId===c.id); if(!v) return;
    consumoVisita(v).forEach(co=>{ if(co.unidad==="ml") coste+=costeAromaMl(co.producto, co.cantidad); });
  });
  return coste;
}
// beneficio real de un cliente en un rango = facturación (documentos facturables) - coste real de aroma consumido
function beneficioCliente(c, desde, hasta){
  const facturacion = (S.documentos||[]).filter(d=>d.clienteId===c.id && esFacturable(d) && d.fecha>=desde && d.fecha<=hasta)
    .reduce((s,d)=>s+((d.total!=null?d.total:d.importe)||0), 0);
  return facturacion - costeAromaClienteRango(c, desde, hasta);
}
function consumoRows(map){
  const keys=Object.keys(map).sort();
  if(!keys.length) return `<div class="empty" style="padding:22px">Sin consumo registrado</div>`;
  return keys.map(k=>`<div class="suml"><div class="sl">${k==="Bacteriostático"?"🧴":"🌸"} ${k}</div><div class="sv">${fmtConsumo(map[k])}</div></div>`).join("");
}
// consumo por producto separado por familia de dispositivo: {nebu(ml), hidro(botes), bact(botes)}
function agregarConsumoTabla(visitas){
  const map={};
  (visitas||[]).forEach(v=>{ consumoVisita(v).forEach(co=>{
    const d=disp(co.dispositivo);
    const row = map[co.producto] = map[co.producto]||{nebu:0,hidro:0,bact:0};
    if(d.bacterio) row.bact+=co.cantidad;
    else if(co.unidad==="ml") row.nebu+=co.cantidad;
    else row.hidro+=co.cantidad;
  }); });
  return map;
}
function consumoTabla(map){
  const keys=Object.keys(map).sort();
  if(!keys.length) return `<div class="empty" style="padding:22px">Sin consumo registrado</div>`;
  const cell=n=> n? `${n}` : "—";
  const tot={nebu:0,hidro:0,bact:0};
  keys.forEach(k=>{ tot.nebu+=map[k].nebu||0; tot.hidro+=map[k].hidro||0; tot.bact+=map[k].bact||0; });
  return `<div class="ctable-wrap"><table class="ctable">
    <thead><tr><th>Aroma</th><th class="num">Nebu (ml)</th><th class="num">Hidro</th><th class="num">Bact.</th></tr></thead>
    <tbody>${keys.map(k=>{const r=map[k];return `<tr>
      <td>${k==="Bacteriostático"?"🧴":"🌸"} ${k}</td>
      <td class="num">${cell(r.nebu)}</td>
      <td class="num">${cell(r.hidro)}</td>
      <td class="num">${cell(r.bact)}</td></tr>`;}).join("")}</tbody>
    <tfoot><tr>
      <td>Σ Total</td>
      <td class="num">${tot.nebu} ml</td>
      <td class="num">${tot.hidro}</td>
      <td class="num">${tot.bact}</td></tr></tfoot>
  </table></div>`;
}

/* ubicación del negocio en Google Maps */
function mapsUrl(c){
  if(c.lat!=null && c.lng!=null && c.lat!=="" && c.lng!=="") return "https://www.google.com/maps/search/?api=1&query="+c.lat+","+c.lng;
  const q = encodeURIComponent([c.negocio, c.direccion, c.municipio].filter(Boolean).join(", "));

}

/* ---------- estado ---------- */
// var (no let) para evitar TDZ: seed() lee S vía DISPOSITIVOS_() durante su propia construcción
var S = load();
var currentTab = "Inicio";

function load(){
  try{ const raw = localStorage.getItem(LS_KEY); if(raw){ const s=JSON.parse(raw);
    patchState(s);
    try{ localStorage.setItem(LS_KEY, JSON.stringify(s)); }catch(err){}
    return s; } }catch(e){}
  return seed();
}
// Aplica defaults/migraciones al estado cargado (desde localStorage o del servidor)
function patchState(s){
    if(!s.aromas||!s.aromas.length) s.aromas=DEFAULT_AROMAS.slice();
    if(!s.sectores||!s.sectores.length) s.sectores=DEFAULT_SECTORES.slice();
    if(!s.tareas) s.tareas=[];
    if(!s.reprogram) s.reprogram={};
    if(!s.aromaCoste) s.aromaCoste={};
    if(!s.aromaCategoria) s.aromaCategoria={};
    if(!s.aromaProveedor) s.aromaProveedor={};
    if(!s.eventos) s.eventos=[];
    if(!s.aromaCompra){
      s.aromaCompra={}; Object.keys(s.aromaCoste).forEach(a=>{ s.aromaCompra[a]={"Litro nebulización":s.aromaCoste[a]}; });
    }
    if(!s.formatoVenta) s.formatoVenta={"Litro nebulización":150,"Bote hidroalcohólico":13,"Bacteriostático":0};
    if(!s.fichajes) s.fichajes=[];
    if(!s.documentos) s.documentos=[];
    if(!s.solicitudes) s.solicitudes=[];
    if(s.autoClose===undefined) s.autoClose=false;
    if(!s.empresa) s.empresa=DEFAULT_EMPRESA;
    if(!s.proveedores) s.proveedores=[];
    if(!s.vehiculos) s.vehiculos=[];
    if(!s.dispositivos||!s.dispositivos.length) s.dispositivos=DISPOSITIVOS_DEFAULT.slice();
    if(!s.stockDifusores) s.stockDifusores={};
    if(!s.ivaPct) s.ivaPct=21;
    (s.rutas||[]).forEach(r=>{ if(r.municipio===undefined) r.municipio=""; });
    if(!s.numeracion) s.numeracion={factura:{prefijo:"FAC-",siguiente:1},presupuesto:{prefijo:"PRE-",siguiente:1},albaran:{prefijo:"ALB-",siguiente:1}};
    (s.tecnicos||[]).forEach(t=>{
      if(t.id==="t1" || t.nombre==="Juan Martín") t.nombre="Técnico 1";
      if(t.id==="t2" || t.nombre==="Ana López") t.nombre="Técnico 2";
      if(t.id==="t3" || t.nombre==="Marta Ruiz") t.nombre="Técnico 3";
    });
}
// Almacenamiento: localStorage tiene ~5 MB. Las fotos de gasto (base64) pueden agotarlo.

// De momento capturamos el error de cuota para que la app no se rompa al guardar.
function save(){
  // 1. Cache local inmediata (para que la app responda instantáneamente)
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }
  catch(e){ if(e && (e.name==="QuotaExceededError"||e.code===22)) toast("⚠ Almacenamiento lleno: exporta una copia o borra fotos"); else throw e; }

  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(() => syncToServer(), 2000);
}

/* ---------- lógica de jornada ---------- */
// clave jornada: `${fecha}__${rutaId}`
function jKey(fecha,rutaId){ return fecha+"__"+rutaId; }

function getJornada(fecha, rutaId){
  const k = jKey(fecha,rutaId);
  if(S.jornadas[k]) return S.jornadas[k];
  // generar: pendientes heredadas primero + programados
  const heredadas = collectPendientes(fecha, rutaId);
  const heredIds = new Set(heredadas.map(h=>h.clienteId));
  const programados = S.clientes.filter(c=>c.rutaId===rutaId && c.activo!==false && !heredIds.has(c.id));
  const visitas = [];
  let orden = -heredadas.length;
  heredadas.forEach(h=>{ visitas.push(newVisita(h.clienteId, "pendiente", true, orden++)); });
  programados.forEach(c=>{ visitas.push(newVisita(c.id, "programada", false, orden++)); });
  const ruta = S.rutas.find(r=>r.id===rutaId);
  const j = {fecha, rutaId, tecnicoId: ruta?ruta.tecnicoId:null, visitas, cerrada:false};
  S.jornadas[k] = j; save();
  return j;
}
function newVisita(clienteId, estado, heredada, orden){
  return {clienteId, estado, heredada:!!heredada, orden, servicioOk:null,
    cobro:null, ventaAdic:null, cambioAroma:null, incidencia:null, hora:null};
}
// busca en jornadas cerradas anteriores de esta ruta, las visitas que quedaron pendientes y no se han resuelto después
function collectPendientes(fecha, rutaId){
  const prev = Object.values(S.jornadas)
    .filter(j=>j.rutaId===rutaId && j.fecha < fecha && j.cerrada)
    .sort((a,b)=>a.fecha<b.fecha?1:-1); // más reciente primero
  const out = []; const seen = new Set();
  for(const j of prev){
    for(const v of j.visitas){
      if(seen.has(v.clienteId)) continue;
      // pendiente = no realizada al cerrar (cerrado/ausente/incidencia sin servicio/programada)
      if(v.estado==="realizada"){ seen.add(v.clienteId); continue; }
      out.push({clienteId:v.clienteId});
      seen.add(v.clienteId);
    }
  }
  // solo los que siguen perteneciendo a la ruta y activos
  return out.filter(o=>{ const c=S.clientes.find(x=>x.id===o.clienteId); return c && c.activo!==false && c.rutaId===rutaId; });
}

function cliente(id){ return S.clientes.find(c=>c.id===id); }

function stats(j){
  let cobradoEf=0, cobradoBanco=0, pendienteCobro=0, ventas=0, ventasN=0, incid=0, realizadas=0, pendientes=0, previsto=0;
  j.visitas.forEach(v=>{
    const c = cliente(v.clienteId); if(c) previsto += c.importe||0;
    if(v.estado==="realizada"){ realizadas++;
      if(v.cobro){ if(v.cobro.forma==="efectivo") cobradoEf+=v.cobro.importe;
        else if(v.cobro.forma==="domiciliacion") cobradoBanco+=v.cobro.importe;
        else pendienteCobro+=v.cobro.importe; }
    } else if(["cerrado","ausente","incidencia","pendiente","programada"].includes(v.estado)){ if(v.estado!=="programada") pendientes++; }
    if(v.ventaAdic){ ventas+=v.ventaAdic.importe||0; ventasN++; }
    if(v.incidencia) incid++;
  });
  // pendientes: contamos cerrado/ausente/incidencia + programadas restantes al cerrar
  const noResueltas = j.visitas.filter(v=>v.estado!=="realizada").length;
  const produccion = cobradoEf + cobradoBanco + ventas;
  return {programados:j.visitas.length, realizadas, pendientes:noResueltas, cobradoEf, cobradoBanco,
    pendienteCobro, ventas, ventasN, incid, produccion, previsto};
}

function ic(name, size, cls){
  const s=size||18;
  return `<svg class="ic${cls?' '+cls:''}" viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||""}</svg>`;
}
// tarjeta KPI con icono + variación opcional respecto al periodo anterior (null = sin dato comparable, no se inventa)
function kpiCard(iconName, valor, label, delta, extraClass){
  const deltaHtml = delta==null ? "" : `<span class="kpi-delta ${delta>0?'up':delta<0?'down':'flat'}">${delta===0?"":ic(delta>0?'arrowUpRight':'arrowDownRight',12)}${delta===0?"=":Math.abs(Math.round(delta))+"%"}</span>`;
  return `<div class="kpi ${extraClass||''}">
    <div class="kpi-head"><div class="kpi-ic">${ic(iconName,17)}</div>${deltaHtml}</div>
    <div class="n">${valor}</div><div class="l">${label}</div></div>`;
}
// variación % entre dos números (null si no hay base para comparar, para no inventar el dato)
function deltaPct(actual, anterior){
  if(anterior==null) return null;
  if(!anterior) return actual>0?100:0;
  return ((actual-anterior)/anterior)*100;
}
// ---- gráficos SVG ligeros (sin librerías: la app sigue siendo un solo archivo sin dependencias) ----
function barChart(data, opts){
  opts=opts||{}; const w=opts.w||520, h=opts.h||160, pad=28;
  const max=Math.max(1,...data.map(d=>d.v));
  const bw=(w-pad*2)/data.length;
  const bars=data.map((d,i)=>{
    const bh=Math.max(2,(d.v/max)*(h-38)); const x=pad+i*bw+bw*0.18; const bwi=bw*0.64;
    return `<rect x="${x}" y="${h-24-bh}" width="${bwi}" height="${bh}" rx="4" fill="${d.color||'var(--accent)'}"/>
      <text x="${x+bwi/2}" y="${h-8}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${esc(d.label)}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="overflow:visible">${bars}</svg>`;
}
function donutChart(segments, size){
  size=size||140; const r=size/2-10, cx=size/2, cy=size/2, circ=2*Math.PI*r;
  const total=segments.reduce((s,x)=>s+x.v,0)||1;
  let acc=0;
  const arcs=segments.map(s=>{
    const frac=s.v/total; const len=frac*circ; const off=circ-acc*circ; acc+=frac;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="15"
      stroke-dasharray="${len} ${circ-len}" stroke-dashoffset="${off}" transform="rotate(-90 ${cx} ${cy})"/>`;
  }).join("");
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="15"/>
    ${arcs}<text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="20" font-weight="800" fill="var(--ink)">${total}</text></svg>`;
}

function horasEntre(iso1,iso2){
  if(!iso1||!iso2) return "—"; const ms=new Date(iso2)-new Date(iso1);
  const h=Math.floor(ms/3600000), m=Math.round((ms%3600000)/60000);
  return h+"h "+String(m).padStart(2,"0")+"m";
}
function horasDecimal(iso1,iso2){ if(!iso1||!iso2) return 0; return (new Date(iso2)-new Date(iso1))/3600000; }

// solicitud aprobada del técnico que cubre esa fecha (o null)
function tecnicoEnLicencia(tecnicoId, fecha){
  return (S.solicitudes||[]).find(s=>s.tecnicoId===tecnicoId && s.estado==="aprobada" && fecha>=s.fechaInicio && fecha<=s.fechaFin) || null;
}
// estado unificado del técnico para hoy: licencia > en ruta (jornada fichada sin cerrar) > jornada finalizada > disponible/descanso
function estadoTecnico(t){
  const lic=tecnicoEnLicencia(t.id, S.fecha);
  if(lic) return {key:lic.tipo, label:TIPO_LICENCIA[lic.tipo], cls: lic.tipo==="baja"?"mt-crit":"mt-vio"};
  const fj=(S.fichajes||[]).find(x=>x.tecnicoId===t.id && x.fecha===S.fecha);
  if(fj && !fj.horaFin) return {key:"en_ruta", label:"⏱ En ruta", cls:"mt-warn"};
  if(fj && fj.horaFin) return {key:"finalizada", label:"✓ Jornada finalizada", cls:"mt-good"};
  const rutaHoy = S.rutas.some(r=>r.tecnicoId===t.id && rutasDelDia(S.fecha).some(rd=>rd.id===r.id));
  return rutaHoy ? {key:"disponible", label:"Disponible", cls:"mt-neutral"} : {key:"descanso", label:"Descanso (sin ruta hoy)", cls:"mt-neutral"};
}

    return `<div class="row"><div class="ri">🕐</div>
      <div class="rm"><div class="rn">${esc(t?t.nombre:"—")} · ${fmtDate(x.fecha)}</div>
      <div class="rd">Inicio ${x.horaInicio.slice(11,16)}${x.horaFin?` · Fin ${x.horaFin.slice(11,16)} · ${horasEntre(x.horaInicio,x.horaFin)}`:" · en curso"}</div></div>
      ${!x.horaFin?'<span class="mtag mt-warn">En curso</span>':'<span class="mtag mt-good">Completo</span>'}</div>`;
  }).join("");
  // horas acumuladas del mes actual por técnico
  const mesActual = S.fecha.slice(0,7);
  const horasMes = S.tecnicos.map(t=>{
    const total = (S.fichajes||[]).filter(x=>x.tecnicoId===t.id && x.fecha.slice(0,7)===mesActual && x.horaFin)
      .reduce((s,x)=>s+horasDecimal(x.horaInicio,x.horaFin),0);
    return `<div class="suml"><div class="sl">${esc(t.nombre)}</div><div class="sv">${total.toFixed(1)} h este mes</div></div>`;
  }).join("");
  // solicitudes de vacaciones/asuntos propios pendientes de aprobar
  const pendientes = (S.solicitudes||[]).filter(s=>s.estado==="pendiente");
  const solRows = (S.solicitudes||[]).slice().sort((a,b)=>b.creada.localeCompare(a.creada)).map(s=>{ const t=tecnico(s.tecnicoId);
    const badge={pendiente:'<span class="mtag mt-warn">Pendiente</span>',aprobada:'<span class="mtag mt-good">Aprobada</span>',rechazada:'<span class="mtag mt-crit">Rechazada</span>'};
    return `<div class="row"><div class="ri">${s.tipo==="vacaciones"?"🏖️":"📋"}</div>
      <div class="rm"><div class="rn">${esc(t?t.nombre:"—")} · ${TIPO_LICENCIA[s.tipo]}</div><div class="rd">${fmtDate(s.fechaInicio)} → ${fmtDate(s.fechaFin)}${s.nota?" · "+esc(s.nota):""}</div></div>
      ${s.estado==="pendiente"?`<button class="mtag mt-good" onclick="resolverSolicitud('${s.id}','aprobada')">Aprobar</button><button class="mtag mt-crit" onclick="resolverSolicitud('${s.id}','rechazada')">Rechazar</button>`:badge[s.estado]}</div>`;
  }).join("");
  return `<div class="sec-t">Horas acumuladas del mes</div>
    <div class="sumcard">${horasMes}</div>
    <div class="sec-t">Solicitudes de vacaciones / asuntos propios <span class="cnt">${pendientes.length} pendientes</span></div>
    ${solRows||`<div class="empty" style="padding:16px">Sin solicitudes.</div>`}
    <div class="sec-t">Fichajes</div>
    <div class="filtros">
      <div class="ff"><label>Técnico</label><select onchange="setFichF('tecnicoId',this.value)">${opt("","Todos",f.tecnicoId)}${S.tecnicos.map(t=>opt(t.id,t.nombre,f.tecnicoId)).join("")}</select></div>
      <div class="ff"><label>Fecha</label><input type="date" value="${f.fecha}" onchange="setFichF('fecha',this.value)"></div>
    </div>
    ${rows||`<div class="empty"><span class="ei">🕐</span>Sin fichajes registrados todavía.</div>`}`;
}

/* ---- HISTÓRICO ---- */
let histFiltro={clienteId:"",rutaId:"",desde:"",hasta:"",estado:""};
function setHistF(k,v){ histFiltro[k]=v; renderHistorico(); }
const ESTADO_VISITA_LABEL={realizada:"✅ Realizada",incidencia:"⚠️ Incidencia",ausente:"🚪 Ausente",cerrado:"🔒 Cerrado",pendiente:"↪️ Pendiente"};
function renderHistorico(){
  const el = document.getElementById("viewHistorico");
  const rutaIds = new Set(availableRutas().map(r=>r.id));
  const f=histFiltro; const opt=(v,t,sel)=>`<option value="${v}" ${v===sel?"selected":""}>${t}</option>`;
  const cerradas = Object.values(S.jornadas).filter(j=>j.cerrada && rutaIds.has(j.rutaId)
      && (!f.rutaId||j.rutaId===f.rutaId) && (!f.desde||j.fecha>=f.desde) && (!f.hasta||j.fecha<=f.hasta))
    .sort((a,b)=> a.fecha<b.fecha?1:(a.fecha>b.fecha?-1:0));
  const filtrosHtml = `<div class="filtros">
      <div class="ff"><label>Cliente</label><select onchange="setHistF('clienteId',this.value)">${opt("","Todos",f.clienteId)}${S.clientes.map(c=>opt(c.id,c.negocio,f.clienteId)).join("")}</select></div>
      <div class="ff"><label>Ruta</label><select onchange="setHistF('rutaId',this.value)">${opt("","Todas",f.rutaId)}${S.rutas.map(r=>opt(r.id,r.nombre,f.rutaId)).join("")}</select></div>
      <div class="ff"><label>Desde</label><input type="date" value="${f.desde}" onchange="setHistF('desde',this.value)"></div>
      <div class="ff"><label>Hasta</label><input type="date" value="${f.hasta}" onchange="setHistF('hasta',this.value)"></div>
      <div class="ff"><label>Tipo de servicio / estado</label><select onchange="setHistF('estado',this.value)">${opt("","Todos",f.estado)}${Object.keys(ESTADO_VISITA_LABEL).map(k=>opt(k,ESTADO_VISITA_LABEL[k],f.estado)).join("")}</select></div>
    </div>
    ${(f.clienteId||f.rutaId||f.desde||f.hasta||f.estado)?`<button class="addbtn" style="margin-bottom:10px" onclick="histFiltro={clienteId:'',rutaId:'',desde:'',hasta:'',estado:''};renderHistorico()">✕ Quitar filtros</button>`:""}`;
  if(!cerradas.length){
    el.innerHTML = filtrosHtml+`<div class="empty"><span class="ei">📅</span>Aún no hay jornadas cerradas.<br>Cuando cierres una jornada, aparecerá aquí.</div>`;
    return;
  }
  // vista detallada por CLIENTE/VISITA cuando hay filtro de cliente o de estado (no siempre calza con la vista por jornada)
  if(f.clienteId||f.estado){
    const filas=[];
    cerradas.forEach(j=>{ const ruta=S.rutas.find(r=>r.id===j.rutaId);
      j.visitas.forEach(v=>{
        if(f.clienteId && v.clienteId!==f.clienteId) return;
        if(f.estado && v.estado!==f.estado) return;
        const c=cliente(v.clienteId); if(!c) return;
        filas.push({fecha:j.fecha, ruta, c, v});
      });
    });
    filas.sort((a,b)=>b.fecha.localeCompare(a.fecha));
    const rows=filas.map(x=>`<div class="row" onclick="verHistorico('${x.fecha}','${x.ruta?x.ruta.id:''}')">
      <div class="ri">🏢</div><div class="rm"><div class="rn">${esc(x.c.negocio)}</div>
        <div class="rd">${esc(x.ruta?x.ruta.nombre:"")} · ${fmtDate(x.fecha)}</div></div>
      <span class="mtag mt-neutral">${ESTADO_VISITA_LABEL[x.v.estado]||x.v.estado}</span></div>`).join("");
    el.innerHTML = filtrosHtml + `<div class="sec-t">Resultados <span class="cnt">${filas.length}</span></div>`
      + (rows||`<div class="empty">Sin resultados para el filtro.</div>`);
    return;
  }
  let totalProd=0, totalDias=new Set();
  cerradas.forEach(j=>{ totalProd += stats(j).produccion; totalDias.add(j.fecha); });
  const byDate = {};
  cerradas.forEach(j=>{ (byDate[j.fecha]=byDate[j.fecha]||[]).push(j); });
  let html = filtrosHtml + `<div class="kpis">
      <div class="kpi"><div class="n">${totalDias.size}</div><div class="l">Jornadas cerradas</div></div>
      <div class="kpi"><div class="n">${EUR(totalProd)}</div><div class="l">Producción acumulada</div></div>
    </div>`;
  Object.keys(byDate).sort((a,b)=>a<b?1:-1).forEach(fecha=>{
    html += `<div class="sec-t">${fmtDate(fecha)}</div>`;
    byDate[fecha].forEach(j=>{
      const st = stats(j); const ruta = S.rutas.find(r=>r.id===j.rutaId); const tec = ruta?tecnico(ruta.tecnicoId):null;
      html += `<div class="row" onclick="verHistorico('${fecha}','${j.rutaId}')">
        <div class="ri">${tec?inits(tec.nombre):"🚚"}</div>
        <div class="rm"><div class="rn">${ruta?ruta.nombre:"Ruta"}${j.discrepancia?` <span class="mtag mt-crit">⚠ Discrepancia</span>`:""}</div>
          <div class="rd">${st.realizadas}/${st.programados} visitas${st.pendientes?` · ${st.pendientes} pdtes`:""}${st.incid?` · ⚠${st.incid}`:""}</div></div>
        <div style="text-align:right"><div style="font-weight:800">${EUR(st.produccion)}</div><div class="rd">💵 ${EUR(st.cobradoEf)}</div></div>
      </div>`;
    });
  });
  el.innerHTML = html;
}

    <button class="cta ghost" style="margin-top:16px" onclick="closeSheet()">Cerrar</button>`;
  openSheet();

function renderClientesTecnico(){
  if(isAdmin()) return;
  const el=document.getElementById("viewClientes"); if(!el) return;
  const tid=S.session&&S.session.tecnicoId;
  const misRutas=S.rutas.filter(r=>r.tecnicoId===tid).map(r=>r.id);
  const q=clientesTecQuery.toLowerCase().trim();
  let cs=S.clientes.filter(c=>misRutas.includes(c.rutaId) && c.activo!==false);
  if(q) cs=cs.filter(c=>(c.negocio+" "+c.direccion).toLowerCase().includes(q));
  cs.sort((a,b)=>a.negocio.localeCompare(b.negocio,"es"));
  const rows=cs.map(c=>{ const r=S.rutas.find(x=>x.id===c.rutaId);
    return `<div class="row" role="button" tabindex="0" onkeydown="kb(event)" onclick="verClienteTecnico('${c.id}')">

  el.innerHTML=`<input id="tec_cli_search" class="fld-inp" placeholder="Buscar cliente, dirección…" value="${esc(clientesTecQuery)}" oninput="setClientesTecQuery(this.value)">

function onGastoFoto(inp){
  const f=inp.files[0]; if(!f) return; captureGasto();
  const rd=new FileReader();
  rd.onload=e=>{ const img=new Image(); img.onload=()=>{ gastoDraft.foto=downscale(img); drawGastoSheet(); }; img.src=e.target.result; };
  rd.readAsDataURL(f);
}
// reduce la foto para que no sature el almacenamiento del móvil
function downscale(img){
  const max=1100; let w=img.width, h=img.height;
  if(w>h && w>max){ h=Math.round(h*max/w); w=max; } else if(h>=w && h>max){ w=Math.round(w*max/h); h=max; }
  const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
  cv.getContext("2d").drawImage(img,0,0,w,h);
  return cv.toDataURL("image/jpeg",0.55);
}
// genera una imagen de ejemplo (ticket/documento/firma) para poblar la demo con adjuntos reales, sin depender de archivos externos
function placeholderDoc(tipo, lineas, colorFondo, colorTexto){
  const w=420, h=tipo==="firma"?160:560;
  const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
  const ctx=cv.getContext("2d");
  ctx.fillStyle=colorFondo||"#ffffff"; ctx.fillRect(0,0,w,h);
  ctx.strokeStyle="#d0d5dd"; ctx.lineWidth=2; ctx.strokeRect(1,1,w-2,h-2);
  ctx.fillStyle=colorTexto||"#101828"; ctx.textAlign="left";
  if(tipo==="firma"){
    ctx.strokeStyle=colorTexto||"#1D4ED8"; ctx.lineWidth=3; ctx.beginPath();
    let x=30, y=90; ctx.moveTo(x,y);
    for(let i=0;i<9;i++){ x+=40; y=90+Math.sin(i*1.3)*35+(Math.random()*10-5); ctx.lineTo(x,y); }
    ctx.stroke();
    ctx.font="12px system-ui"; ctx.fillStyle="#98A2B3"; ctx.fillText("Firma del cliente", 20, h-16);
  } else {
    ctx.font="bold 18px system-ui"; ctx.fillText(lineas[0]||"", 24, 40);
    ctx.font="13px system-ui";
    (lineas.slice(1)||[]).forEach((l,i)=>{ ctx.fillText(l, 24, 76+i*24); });
    ctx.strokeStyle="#e4e7ec"; for(let y=76+((lineas.length-1)*24)+20;y<h-30;y+=18){ ctx.beginPath(); ctx.moveTo(24,y); ctx.lineTo(w-24,y); ctx.stroke(); }
  }
  return cv.toDataURL("image/png");
}

/* ---- reordenar la hoja de ruta arrastrando a cualquier posición ---- */
let dragEl=null, dragHandle=null;
function dragStart(ev){
  ev.stopPropagation(); ev.preventDefault();
  dragHandle=ev.currentTarget;
  dragEl=dragHandle.closest(".cli-wrap"); if(!dragEl) return;
  dragEl.classList.add("dragging");
  try{ dragHandle.setPointerCapture(ev.pointerId); }catch(e){}
  dragHandle.addEventListener("pointermove", dragMove);
  dragHandle.addEventListener("pointerup", dragEnd);
  dragHandle.addEventListener("pointercancel", dragEnd);
}
function dragMove(ev){
  if(!dragEl) return;
  const cont=dragEl.parentNode, y=ev.clientY;
  const others=[...cont.querySelectorAll(".cli-wrap:not(.dragging)")];
  let before=null;
  for(const w of others){ const r=w.getBoundingClientRect(); if(y < r.top + r.height/2){ before=w; break; } }
  if(before) cont.insertBefore(dragEl, before);
  else { const add=cont.querySelector(".addbtn"); if(add) cont.insertBefore(dragEl, add); else cont.appendChild(dragEl); }
}
function dragEnd(){
  if(!dragEl) return;
  if(dragHandle){ dragHandle.removeEventListener("pointermove",dragMove); dragHandle.removeEventListener("pointerup",dragEnd); dragHandle.removeEventListener("pointercancel",dragEnd); }
  const order=[...dragEl.parentNode.querySelectorAll(".cli-wrap")].map(w=>w.dataset.cid);
  dragEl.classList.remove("dragging"); dragEl=null; dragHandle=null;
  commitOrder(order);
}
function commitOrder(cids){
  const j=getJornada(S.fecha,currentRuta().id);
  const pend=v=>v.estado==="programada"||v.estado==="pendiente"||v.estado==="ausente";
  const byId={}; j.visitas.forEach(v=>byId[v.clienteId]=v);
  const pendVis=cids.map(id=>byId[id]).filter(v=>v&&pend(v));
  const resto=j.visitas.filter(v=>!pend(v));
  j.visitas=[...pendVis,...resto];
  save(); renderAll();
}
// ¿la ruta rutaId, si se le asigna tid, choca algún día con otra ruta del mismo técnico? (ventana de 60 días)
function solapeRuta(rutaId, tid){
  const ruta=S.rutas.find(x=>x.id===rutaId); if(!ruta||!ruta.fechaAncla||!tid) return null;
  const otras=S.rutas.filter(r=>r.id!==rutaId && r.tecnicoId===tid && r.fechaAncla);
  if(!otras.length) return null;
  for(let i=0;i<60;i++){ const fecha=addDays(S.fecha,i);
    if(rutaCorreEn(ruta,fecha)){ const choque=otras.find(o=>rutaCorreEn(o,fecha)); if(choque) return {fecha,choque}; } }
  return null;
}
/* asignar el técnico de una ruta concreta (solo admin) — id explícito, no depende de la ruta seleccionada.
   Cada técnico solo puede tener UNA ruta activa el mismo día: si hay solape, se pide confirmación explícita. */
function asignarTecnicoRuta(rutaId, tid){
  const r=S.rutas.find(x=>x.id===rutaId); if(!r) return;
  const solape=solapeRuta(rutaId,tid);
  if(solape){
    askConfirm(`⚠ ${tecnico(tid).nombre} ya tiene "${solape.choque.nombre}" el ${fmtDate(solape.fecha)}. Un técnico solo debería llevar una ruta al día. ¿Asignar igualmente?`, ()=>{
      r.tecnicoId=tid||null; save(); renderAdmin(); toast("Ruta asignada a "+tecnico(tid).nombre+" (con solape)");
    }, true);
    renderAdmin(); // revierte el <select> a su valor anterior mientras se decide
    return;
  }
  r.tecnicoId=tid||null; save(); renderAdmin();
  toast("Ruta asignada a "+((tecnico(tid)||{}).nombre||"Sin asignar"));
}
