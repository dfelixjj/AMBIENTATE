// pregunta si un cambio de aroma es solo para esta visita o para las próximas (antes de guardar)
function preguntarAlcanceAroma(){
  const sh=document.getElementById("sheet");
  sh.innerHTML=`<div class="grab"></div><h2>Cambio de aroma</h2>
    <p class="sub">Vas a poner "<b>${esc(sheetState.aroma)}</b>". ¿Solo esta visita o también las próximas?</p>
    <button class="cta" onclick="sheetState._aromaAlcance='solo';guardarVisita()">Solo esta visita</button>
    <button class="cta" onclick="sheetState._aromaAlcance='futuras';guardarVisita()">🔁 También las próximas</button>
    <button class="cta ghost" onclick="sheetState.step='form';drawSheet()">← Volver</button>`;
}
function guardarVisita(){
  const s = sheetState;
  if(s.aroma && s.aroma.trim() && !s._aromaAlcance){ preguntarAlcanceAroma(); return; }
  if(s.servicioOk!==false && s.forma==="domiciliacion" && !s._firma){ abrirFirmaPad(); return; }
  const j = getJornada(S.fecha, currentRuta().id);
  const v = j.visitas.find(x=>x.clienteId===sheetState.cid);
  v.hora = new Date().toISOString();
  v.ventaAdic = (s.venta && s.venta.importe>0)? {producto:s.venta.producto||"Producto", importe:s.venta.importe} : null;
  v.cambioAroma = (s.aroma && s.aroma.trim())? s.aroma.trim() : null;
  v.incidencia = s.incid ? {tipo:s.incid.tipo, nota:s.incid.nota||""} : null;
  if(s.servicioOk===false){
    v.estado = "incidencia"; v.servicioOk=false; v.cobro=null;
  } else {
    v.servicioOk = true; v.estado = "realizada";
    v.cobro = {importe: s.importe||0, forma: s.forma||"efectivo"};
  }
  // aplicar cambio de aroma a la máquina/cliente SOLO si se eligió "también las próximas"
  if(v.cambioAroma && s._aromaAlcance==="futuras"){ const c=cliente(v.clienteId); if(c) c.aroma=v.cambioAroma; }
  // snapshot del consumo de producto de esta visita (una entrada por dispositivo)
  if(v.estado==="realizada"){
    const c=cliente(v.clienteId); const aroma=v.cambioAroma||(c&&c.aroma)||"Sin aroma";
    v.consumo = clienteDisps(c).map(id=>{ const d=disp(id);
      return {dispositivo:d.id, producto:d.bacterio?"Bacteriostático":aroma, unidad:d.unidad, cantidad:d.cantidad}; });
  } else { v.consumo=null; }
  v.firma = s._firma||null;
  // venta puntual -> su propio documento con el producto específico (no bajo "Servicio de Aromatización")
  if(v.ventaAdic){ const c=cliente(v.clienteId);
    (S.documentos=S.documentos||[]).push({id:uid(), tipo:"venta", clienteId:v.clienteId, clienteNombre:c?c.negocio:"",
      producto:v.ventaAdic.producto, importe:v.ventaAdic.importe, fecha:S.fecha}); }
  // cierre de servicio (sección 7/8): al completar la visita se genera automáticamente su documento (albarán con firma si es banco, o factura si es pago directo)
  if(v.estado==="realizada"){ generarDocumentoVisita(v, cliente(v.clienteId)); }
  save(); closeSheet(); renderAll();
  toast(s.servicioOk===false?"⚠ Incidencia registrada":"✓ Visita guardada · "+EUR(v.cobro?v.cobro.importe:0));
  // recordatorio obligatorio: si ya no quedan visitas por hacer y la jornada laboral sigue abierta, avisar
  const quedan = j.visitas.some(x=>x.estado==="programada"||x.estado==="pendiente"||x.estado==="ausente");
  if(!quedan && jornadaIniciada()) setTimeout(()=>toast("🎉 Ruta completada · no olvides FINALIZAR tu jornada laboral"),2300);
}

// Accesibilidad del modal: recuerda el foco previo, oculta el fondo a lectores y mueve el foco al sheet
let sheetPrevFocus=null;
function bgInert(on){
  [document.querySelector(".topbar"), document.getElementById("views"), document.querySelector(".tabbar")]
    .forEach(el=>{ if(!el) return; if(on) el.setAttribute("aria-hidden","true"); else el.removeAttribute("aria-hidden"); });
}
function openSheet(){
  sheetPrevFocus = document.activeElement;
  const sh=document.getElementById("sheet");
  document.getElementById("sheetBg").classList.add("open");
  sh.classList.add("open"); sh.setAttribute("aria-hidden","false");
  bgInert(true);
  const foco = sh.querySelector("input,select,textarea,button,[tabindex]") || sh;
  try{ foco.focus(); }catch(e){}
}
function closeSheet(){
  const sh=document.getElementById("sheet");
  document.getElementById("sheetBg").classList.remove("open");
  sh.classList.remove("open"); sh.setAttribute("aria-hidden","true");
  bgInert(false); sheetState=null;
  if(sheetPrevFocus && sheetPrevFocus.focus){ try{ sheetPrevFocus.focus(); }catch(e){} }
  sheetPrevFocus=null;
}

function cerrarUnaJornada(j){
  j.visitas.forEach(v=>{ if(v.estado==="programada"||v.estado==="ausente") v.estado="pendiente"; });
  j.cerrada = true; j.validadaAdmin = false;
}
// tarea automática: al detectar un día nuevo, cierra los días anteriores abiertos
function autoCloseCheck(){
  if(S.autoClose===false) return false;
  const hoy = todayISO();
  let hecho=false;
  Object.values(S.jornadas).forEach(j=>{ if(!j.cerrada && j.fecha < hoy){ cerrarUnaJornada(j); hecho=true; } });
  if(S.fecha < hoy){ S.fecha = hoy; hecho=true; }
  if(hecho) save();
  return hecho;
}
// cierre manual del día completo (todas las rutas) desde Admin
function cerrarDiaAhora(){
  askConfirm("Se cerrarán TODAS las rutas de hoy y los pendientes pasarán al día siguiente. ¿Continuar?", ()=>{
    S.rutas.forEach(r=>getJornada(S.fecha, r.id)); // asegura que existan
    Object.values(S.jornadas).forEach(j=>{ if(!j.cerrada && j.fecha===S.fecha) cerrarUnaJornada(j); });
    S.fecha = nextDay(S.fecha); save(); renderAll(); switchTab("Inicio");
    toast("🌙 Día cerrado · pendientes al día siguiente");
  });
}

// visitas realizadas de la jornada que aún no tienen factura/albarán generado (no debería pasar: se genera solo al guardar)
function visitasSinDocumentar(j){
  return j.visitas.filter(v=>v.estado==="realizada" &&
    !(S.documentos||[]).some(d=>d.clienteId===v.clienteId && d.fecha===j.fecha && (d.tipo==="factura"||d.tipo==="albaran")));
}
function cerrarJornada(){
  if(!exigirJornada()) return;
  const j = getJornada(S.fecha, currentRuta().id);
  // cierre de servicio: solo si cada visita realizada tiene su documentación (productos + factura/albarán) generada
  const sinDoc = visitasSinDocumentar(j);
  if(sinDoc.length){
    const nombres = sinDoc.map(v=>{const c=cliente(v.clienteId); return c?c.negocio:"cliente";}).join(", ");
    toast("⚠ Falta documentación (factura/albarán) de: "+nombres);
    return;
  }
  const noResueltas = j.visitas.filter(v=>v.estado!=="realizada").length;
  cerrarUnaJornada(j);
  tareaVerificarCierre(j);   // genera tarea al admin para verificar importes y pendientes
  save(); renderAll();
  toast(noResueltas>0?`✓ Cerrada · ${noResueltas} pasan a mañana`:"✓ Jornada cerrada · ¡todo hecho!");
  switchTab("Inicio");
}

// "disputa" cuenta como abierta: sigue viva hasta que el admin la cierra de verdad, no se pierde al marcarla
function todasLasTareasPendientes(){
  const res = [];
  
  // 1. Tareas de Cierre, Discrepancias y Nuevos Clientes
  (S.tareas||[]).filter(t=>t.estado==="pendiente"||t.estado==="disputa").forEach(t=>{
    res.push({
      itemType: "tarea",
      id: t.id,
      tipo: t.tipo,
      estado: t.estado,
      fecha: t.fecha,
      rutaId: t.rutaId,
      tecnicoId: t.tecnicoId,
      clienteId: t.clienteId,
      datos: t.datos,
      notaDiscrepancia: t.notaDiscrepancia
    });
  });

  // 2. Solicitudes de Licencias / Vacaciones / Bajas pendientes
  (S.solicitudes||[]).filter(s=>s.estado==="pendiente").forEach(s=>{
    res.push({
      itemType: "solicitud",
      id: s.id,
      tipo: s.tipo,
      estado: s.estado,
      fecha: s.creada || S.fecha,
      tecnicoId: s.tecnicoId,
      fechaInicio: s.fechaInicio,
      fechaFin: s.fechaFin,
      nota: s.nota
    });
  });

  // 3. Incidencias Abiertas o En Curso
  incidenciasFilas().filter(x=>x.estado==="abierta"||x.estado==="en_curso").forEach(inc=>{
    res.push({
      itemType: "incidencia",
      id: inc.jKey + "__" + inc.clienteId,
      jKey: inc.jKey,
      clienteId: inc.clienteId,
      cliente: inc.cliente,
      tipo: inc.tipo,
      estado: inc.estado,
      rutaId: inc.rutaId,
      ruta: inc.ruta,
      tecnico: inc.tecnico,
      fecha: inc.fecha,
      nota: inc.nota,
      asignadoA: inc.asignadoA,
      notas: inc.notas,
      foto: inc.foto
    });
  });

  // 4. Fichajes sin cerrar / Desfase Horario de Días Anteriores
  (S.fichajes||[]).filter(f=>!f.horaFin && f.fecha < S.fecha).forEach(f=>{
    res.push({
      itemType: "fichaje",
      id: f.id,
      tecnicoId: f.tecnicoId,
      fecha: f.fecha,
      horaInicio: f.horaInicio
    });
  });

  return res.sort((a,b)=>b.fecha.localeCompare(a.fecha));
}

function tareasPendientes(){
  return todasLasTareasPendientes();

let firmaCtx=null, firmaDrawing=false;
function abrirFirmaPad(){
  const sh=document.getElementById("sheet");
  sh.innerHTML=`<div class="grab"></div><h2>Firma del cliente</h2>
    <p class="sub">Pago por domiciliación: el cliente firma para confirmar el servicio (albarán). No es una firma electrónica certificada, queda incrustada como imagen en el documento.</p>
    <canvas id="firmaCanvas" style="width:100%;height:220px;border:2px dashed var(--line);border-radius:12px;background:#fff;touch-action:none;display:block"></canvas>
    <button class="cta ghost" style="margin-top:8px" onclick="limpiarFirma()">Borrar firma</button>
    <button class="cta" onclick="guardarFirma()">Guardar firma y continuar</button>
    <button class="cta ghost" onclick="sheetState.step='form';drawSheet()">← Volver sin firmar</button>`;
  openSheet();
  setTimeout(initFirmaCanvas,60);
}
function initFirmaCanvas(){
  const cv=document.getElementById("firmaCanvas"); if(!cv) return;
  const rect=cv.getBoundingClientRect(); cv.width=rect.width; cv.height=rect.height;
  const ctx=cv.getContext("2d"); ctx.strokeStyle="#15201d"; ctx.lineWidth=2.4; ctx.lineCap="round"; ctx.lineJoin="round"; firmaCtx=ctx;
  let last=null;
  const pos=ev=>{ const r=cv.getBoundingClientRect(); return {x:ev.clientX-r.left,y:ev.clientY-r.top}; };
  cv.onpointerdown=ev=>{ firmaDrawing=true; last=pos(ev); ev.preventDefault(); };
  cv.onpointermove=ev=>{ if(!firmaDrawing) return; const p=pos(ev); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; ev.preventDefault(); };
  cv.onpointerup=()=>{ firmaDrawing=false; };
  cv.onpointerleave=()=>{ firmaDrawing=false; };
}
function limpiarFirma(){ const cv=document.getElementById("firmaCanvas"); if(cv&&firmaCtx) firmaCtx.clearRect(0,0,cv.width,cv.height); }
function guardarFirma(){
  const cv=document.getElementById("firmaCanvas"); if(!cv) return;
  sheetState._firma = cv.toDataURL("image/png");
  guardarVisita();
}

// estado de cobro de un documento: pagada/pendiente ya guardado, o "vencida" si lleva +30 días pendiente/emitida
function estadoFactura(d){
  if(d.tipo==="presupuesto"||d.tipo==="venta"||d.tipo==="cobro") return null;
  if(d.estado==="pagada") return "pagada";
  const total = d.total!=null?d.total:d.importe;
  if(d.cobrado>0 && d.cobrado<total) return "parcial";
  const dias = diasEntre(d.fecha, S.fecha);
  if(dias>30) return "vencida";
  return d.estado||"emitida";
}

let consumoFiltro={aroma:"",desde:"",hasta:"",rutaId:""};
function setCF(k,v){ consumoFiltro[k]=v; renderAdmin(); }
function filtrarMap(map, aroma){ if(!aroma) return map; const o={}; if(map[aroma]) o[aroma]=map[aroma]; return o; }
// helpers de rango de fechas para los resúmenes de consumo
const inicioSemana = iso => { const d=new Date(iso+"T00:00:00Z"); const day=(d.getUTCDay()+6)%7; d.setUTCDate(d.getUTCDate()-day); return d.toISOString().slice(0,10); };
const inicioMes = iso => iso.slice(0,7)+"-01";
function mesAnteriorRango(iso){
  const [y,m]=iso.split("-").map(Number);
  const d=new Date(Date.UTC(y,m-1,1)); d.setUTCMonth(d.getUTCMonth()-1);
  const yy=d.getUTCFullYear(), mm=d.getUTCMonth()+1;
  const desde=`${yy}-${String(mm).padStart(2,"0")}-01`;
  const lastDay=new Date(Date.UTC(yy,mm,0)).getUTCDate();
  return [desde, `${yy}-${String(mm).padStart(2,"0")}-${String(lastDay).padStart(2,"0")}`];
}
function visitasEnRango(desde,hasta,rutaId){
  return Object.values(S.jornadas).filter(j=> j.fecha>=desde && j.fecha<=hasta && (!rutaId||j.rutaId===rutaId)).flatMap(j=>j.visitas);
}
function admConsumo(){
  const f=consumoFiltro;
  const productos=[...S.aromas,"Bacteriostático"];
  const opt=(v,t,sel)=>`<option value="${v}" ${v===sel?"selected":""}>${t}</option>`;
  // consumo de HOY (todas las rutas, respeta filtro de aroma/ruta)

  const tablaHoy = filtrarMap(agregarConsumoTabla(visHoy), f.aroma);
  // 3 resúmenes: semana actual, mes actual, mismo filtro de ruta pero mes anterior
  const tablaSemana = filtrarMap(agregarConsumoTabla(visitasEnRango(inicioSemana(S.fecha), S.fecha, f.rutaId)), f.aroma);
  const tablaMes = filtrarMap(agregarConsumoTabla(visitasEnRango(inicioMes(S.fecha), S.fecha, f.rutaId)), f.aroma);
  const [maDesde,maHasta] = mesAnteriorRango(S.fecha);
  const tablaMesAnt = f.rutaId ? filtrarMap(agregarConsumoTabla(visitasEnRango(maDesde, maHasta, f.rutaId)), f.aroma) : null;
  // histórico filtrado: jornadas cerradas dentro de rango + ruta
  const cerradas = Object.values(S.jornadas).filter(j=>j.cerrada
    && (!f.desde||j.fecha>=f.desde) && (!f.hasta||j.fecha<=f.hasta) && (!f.rutaId||j.rutaId===f.rutaId));
  const porFecha={}; cerradas.forEach(j=>{ (porFecha[j.fecha]=porFecha[j.fecha]||[]).push(...j.visitas); });
  let hist="";
  Object.keys(porFecha).sort((a,b)=>a<b?1:-1).forEach(fe=>{
    const map=filtrarMap(agregarConsumo(porFecha[fe]), f.aroma);
    const linea=Object.keys(map).sort().map(k=>`${k} ${fmtConsumo(map[k])}`).join(" · ");

    hist+=`<div class="row" style="display:block"><div class="rn" style="font-size:14px;margin-bottom:4px">${fmtDate(fe)}</div><div class="rd" style="line-height:1.5">${linea||"—"}</div></div>`;
  });
  return `<div class="filtros">
      <div class="ff"><label>Aroma</label><select onchange="setCF('aroma',this.value)">${opt("","Todos",f.aroma)}${productos.map(p=>opt(p,p,f.aroma)).join("")}</select></div>
      <div class="ff"><label>Ruta</label><select onchange="setCF('rutaId',this.value)">${opt("","Todas",f.rutaId)}${S.rutas.map(r=>opt(r.id,r.nombre,f.rutaId)).join("")}</select></div>
      <div class="ff"><label>Desde</label><input type="date" value="${f.desde}" onchange="setCF('desde',this.value)"></div>
      <div class="ff"><label>Hasta</label><input type="date" value="${f.hasta}" onchange="setCF('hasta',this.value)"></div>
    </div>
    ${(f.aroma||f.desde||f.hasta||f.rutaId)?`<button class="addbtn" style="margin-bottom:8px" onclick="consumoFiltro={aroma:'',desde:'',hasta:'',rutaId:''};renderAdmin()">✕ Quitar filtros</button>`:""}
    <div class="sec-t">Consumo de hoy · ${fmtDate(S.fecha)}</div>
    ${consumoTabla(tablaHoy)}
    <button class="addbtn" style="border-color:var(--accent);color:var(--accent);margin-top:8px" onclick="informeConsumo(S.fecha, consumoFiltro.rutaId||'')">⬇️ Informe de consumo de hoy</button>

/* ==================== CALENDARIO · CICLO DE 28 DÍAS ==================== */
const diasEntre = (a,b)=> Math.round((Date.parse(b+"T00:00:00Z")-Date.parse(a+"T00:00:00Z"))/86400000);
// ¿la ruta corre en esta fecha? ciclo de 28 días desde la ancla, con reprogramaciones puntuales (solo esa vez)
function rutaCorreEn(ruta, fecha){
  if(!ruta.fechaAncla) return false;
  const rep=S.reprogram||{};
  // ¿la fecha es destino de una reprogramación de esta ruta?
  for(const k in rep){ if(rep[k]===fecha && k.indexOf(ruta.id+"__")===0) return true; }
  const diff=diasEntre(ruta.fechaAncla, fecha);
  if(diff>=0 && diff%28===0){
    if(rep[ruta.id+"__"+fecha]) return false; // esa ocurrencia se movió a otro día
    return true;
  }
  return false;
}
function rutasDelDia(fecha){ return S.rutas.filter(r=>rutaCorreEn(r,fecha)); }
// última ocurrencia natural <= fecha
function ultimoRun(ruta, fecha){
  if(!ruta.fechaAncla) return null;
  const freq=ruta.frecuenciaDias||28;
  const diff=diasEntre(ruta.fechaAncla, fecha); if(diff<0) return null;
  return addDays(ruta.fechaAncla, Math.floor(diff/freq)*freq);
}
// próxima ocurrencia >= fecha (hoy mismo si le toca hoy)
function proximaFecha(ruta, fecha){
  if(!ruta.fechaAncla) return null;
  const freq=ruta.frecuenciaDias||28;
  const diff=diasEntre(ruta.fechaAncla, fecha);
  if(diff<0) return ruta.fechaAncla;
  const rem=diff%freq;
  return rem===0 ? fecha : addDays(fecha, freq-rem);
}
// próxima visita programada del cliente, vía la fecha ancla+frecuencia de su ruta
function proximaVisitaCliente(c){
  const r = S.rutas.find(x=>x.id===c.rutaId); if(!r) return null;
  return proximaFecha(r, S.fecha);
}
// facturación de un cliente en los últimos 12 meses (documentos facturables: factura/albarán/venta/cobro)
function facturacionAnualCliente(c){
  const desde = addDays(S.fecha, -365);
  return (S.documentos||[]).filter(d=>d.clienteId===c.id && esFacturable(d) && d.fecha>=desde)
    .reduce((s,d)=>s+((d.total!=null?d.total:d.importe)||0), 0);
}
// una ruta está retrasada si su última ocurrencia < hoy y no se cerró esa jornada
function rutaRetrasada(ruta, hoy){
  const lr=ultimoRun(ruta,hoy); if(!lr || lr>=hoy) return false;
  const j=S.jornadas[lr+"__"+ruta.id];
  return !(j && j.cerrada);
}
// abreviatura corta del nombre de ruta para los chips del calendario (quita "Ruta" y artículos)
function rutaAbrev(nombre){
  const w=(nombre||"").replace(/^Ruta\s+/i,"").split(/\s+/).filter(x=>x && !/^(de|del|la|los|las)$/i.test(x));
  return (w.slice(0,2).map(x=>x[0]).join("")||"?").toUpperCase();
}
let calYear=null, calMonth=null;
function calStep(n){ let m=(calMonth||0)+n, y=calYear; if(m<0){m=11;y--;} if(m>11){m=0;y++;} calMonth=m; calYear=y; renderAdmin(); }
// todo lo que ocurre un día concreto: rutas, incidencias abiertas, vacaciones/bajas, renovaciones (facturas que vencen) y eventos propios
function eventosDelDia(fecha){
  const ev={rutas:[], incidencias:[], licencias:[], renovaciones:[], eventos:[]};
  ev.rutas = rutasDelDia(fecha);
  const j = S.jornadas[jKey(fecha, null)]; // no aplica; las incidencias se buscan por fecha de jornada
  Object.values(S.jornadas).forEach(jo=>{
    if(jo.fecha!==fecha) return;
    jo.visitas.forEach(v=>{ if(v.incidencia && v.incidencia.estado!=="resuelta"){
      const c=cliente(v.clienteId); ev.incidencias.push({cliente:c?c.negocio:"—", tipo:v.incidencia.tipo, estado:v.incidencia.estado}); } });
  });
  (S.solicitudes||[]).forEach(s=>{ if(s.estado==="aprobada" && fecha>=s.fechaInicio && fecha<=s.fechaFin){
    const t=tecnico(s.tecnicoId); ev.licencias.push({tecnico:t?t.nombre:"—", tipo:s.tipo}); } });
  // renovación = factura pendiente que cumple 30 días ese día (momento en que pasa a vencida)
  (S.documentos||[]).forEach(d=>{ if(!esFacturable(d)) return;
    const st=estadoFactura(d); if(st!=="pendiente"&&st!=="emitida"&&st!=="vencida") return;
    if(addDays(d.fecha,30)===fecha) ev.renovaciones.push({cliente:d.clienteNombre||"—", total:(d.total!=null?d.total:d.importe)||0}); });
  (S.eventos||[]).forEach(e=>{ if(e.fecha===fecha) ev.eventos.push(e); });
  return ev;
}

const TIPO_DOC = {presupuesto:["📄","Presupuesto"],factura:["🧾","Factura"],rectificativa:["🔄","Factura Rectificativa"],albaran:["📝","Albarán / nota de entrega"],venta:["➕","Venta puntual"],cobro:["💰","Cobro registrado"]};
// documentos que cuentan como facturación real (no presupuestos)
function esFacturable(d){ return d.tipo==="factura"||d.tipo==="rectificativa"||d.tipo==="albaran"||d.tipo==="venta"||d.tipo==="cobro"; }
// asigna el siguiente folio del tipo (prefijo + serie del año + contador) y avanza el contador guardado en Configuración
function siguienteNumero(tipo){
  S.numeracion = S.numeracion || {};
  const pref = tipo === "rectificativa" ? "REC-" : (tipo.slice(0,3).toUpperCase()+"-");
  const cfg = S.numeracion[tipo] || (S.numeracion[tipo] = {prefijo:pref, siguiente:1});
  const serie = S.fecha.slice(0,4);
  const n = cfg.siguiente || 1;
  cfg.siguiente = n + 1;
  return `${cfg.prefijo||""}${serie}/${String(n).padStart(4,"0")}`;
}

/* ---- FASE 2: MOTOR DE PDF MULTI-LÍNEA Y RECTIFICATIVAS ---- */
function descargarPDFDocumento(docId) {
  const d = (S.documentos || []).find(x => x.id === docId);
  if (!d) return;
  const c = cliente(d.clienteId);
  const emp = S.empresa || DEFAULT_EMPRESA;
  const total = d.total != null ? d.total : d.importe;
  const isNota = c && c.notaTrabajo;
  const ivaPct = d.ivaPct != null ? d.ivaPct : (isNota ? 0 : 21);
  const baseImponible = d.baseImponible != null ? d.baseImponible : Math.round((total / (1 + ivaPct / 100)) * 100) / 100;
  const ivaCuota = d.ivaCuota != null ? d.ivaCuota : Math.round((total - baseImponible) * 100) / 100;

  if (window.jspdf && window.jspdf.jsPDF) {
    try {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ unit: 'mm', format: 'a4' });
      const pageWidth = pdf.internal.pageSize.getWidth();

      pdf.setFillColor(37, 99, 235);
      pdf.rect(0, 0, pageWidth, 5, 'F');

      // Datos Empresa
      pdf.setTextColor(16, 24, 40);
      pdf.setFont('helvetica', 'bold');
      pdf.setFontSize(16);
      pdf.text(emp.razonSocial || 'AMBIÉNTATE Aromatización S.L.', 14, 20);

      pdf.setFont('helvetica', 'normal');
      pdf.setFontSize(8.5);
      pdf.setTextColor(102, 112, 133);
      pdf.text(`CIF: ${emp.cif || 'B-12345678'}`, 14, 26);
      pdf.text(emp.direccion || 'Pol. Ind. La Red, Nave 7 · Alcalá de Guadaíra, Sevilla', 14, 31);
      pdf.text(`Tel: ${emp.telefono || '954 123 456'} · Email: ${emp.email || 'info@ambientate.es'}`, 14, 36);

      // Bloque Documento
      const tipoNombre = (TIPO_DOC[d.tipo] ? TIPO_DOC[d.tipo][1] : d.tipo).toUpperCase();
      pdf.setFillColor(240, 243, 248);
      pdf.roundedRect(pageWidth - 75, 14, 61, 26, 3, 3, 'F');

      pdf.setTextColor(37, 99, 235);
      pdf.setFont('helvetica', 'bold');
      pdf.setFontSize(10.5);
      pdf.text(tipoNombre, pageWidth - 44, 21, { align: 'center' });

      pdf.setTextColor(16, 24, 40);
      pdf.setFontSize(10);
      pdf.text(`N°: ${d.numero || '---'}`, pageWidth - 44, 28, { align: 'center' });
      pdf.setFontSize(8);
      pdf.setTextColor(102, 112, 133);
      pdf.text(`Fecha: ${fmtDate(d.fecha)}`, pageWidth - 44, 34, { align: 'center' });

      pdf.setDrawColor(228, 231, 236);
      pdf.setLineWidth(0.5);
      pdf.line(14, 44, pageWidth - 14, 44);

      // Bloques Cliente y Pago
      pdf.setFillColor(248, 250, 252);
      pdf.roundedRect(14, 48, 88, 30, 2, 2, 'F');
      pdf.setTextColor(37, 99, 235);
      pdf.setFont('helvetica', 'bold');
      pdf.setFontSize(9);
      pdf.text('DATOS DEL CLIENTE', 18, 54);

      pdf.setTextColor(16, 24, 40);
      pdf.setFontSize(9.5);
      pdf.text(c ? c.negocio : (d.clienteNombre || '---'), 18, 60);
      pdf.setFont('helvetica', 'normal');
      pdf.setFontSize(8.5);
      pdf.setTextColor(102, 112, 133);
      pdf.text(`Dirección: ${c ? (c.direccion || '---') : '---'}`, 18, 66);
      if (c && c.banco && c.banco.iban) pdf.text(`IBAN: ${c.banco.iban}`, 18, 72);

      pdf.setFillColor(248, 250, 252);
      pdf.roundedRect(108, 48, 88, 30, 2, 2, 'F');
      pdf.setTextColor(37, 99, 235);
      pdf.setFont('helvetica', 'bold');
      pdf.setFontSize(9);
      pdf.text('INFORMACIÓN DE FACTURACIÓN', 112, 54);

      pdf.setTextColor(16, 24, 40);
      pdf.setFont('helvetica', 'normal');
      pdf.setFontSize(8.5);
      const formaLabel = c ? (c.formaHabitual === 'domiciliacion' ? '🏦 Domiciliación Bancaria' : '💵 Efectivo') : 'Efectivo';
      pdf.text(`Forma de pago: ${formaLabel}`, 112, 60);
      pdf.text(`Estado del cobro: ${(ESTADO_FACTURA_UI[estadoFactura(d)] || {label:'Emitida'}).label}`, 112, 66);

      // Tabla de conceptos / productos
      const startY = 85;
      const headers = [['CONCEPTO / DESCRIPCIÓN', 'CANT.', 'BASE UNIT.', 'IVA %', 'TOTAL (€)']];
      let rows = [];

      if (Array.isArray(d.lineas) && d.lineas.length) {
        rows = d.lineas.map(l => {
          const cant = l.cantidad || 1;
          const pu = l.precioUnit || 0;
          const totL = Math.round(cant * pu * (1 + ivaPct / 100) * 100) / 100;
          return [l.concepto, cant.toString(), `${pu.toFixed(2)} €`, `${ivaPct}%`, `${totL.toFixed(2)} €`];

      pdf.text(`${ivaCuota.toFixed(2)} €`, totX + 62, finalY + 16, { align: 'right' });

      pdf.setFont('helvetica', 'bold');
      pdf.setFontSize(10.5);
      pdf.setTextColor(37, 99, 235);
      pdf.text('TOTAL FACTURA:', totX + 4, finalY + 26);
      pdf.text(`${total.toFixed(2)} €`, totX + 62, finalY + 26, { align: 'right' });

      if (d.firma) {
        try {
          pdf.setFontSize(8.5);
          pdf.setTextColor(16, 24, 40);
          pdf.text('Firma de conformidad del cliente:', 14, finalY + 8);
          pdf.addImage(d.firma, 'PNG', 14, finalY + 11, 48, 18);
        } catch(e){}
      }

      const footerY = 280;
      pdf.setFont('helvetica', 'normal');
      pdf.setFontSize(7.5);
      pdf.setTextColor(152, 162, 179);
      pdf.text('De conformidad con el RGPD y la LOPDGDD 3/2018, sus datos personales son tratados por AMBIÉNTATE Aromatización S.L.', pageWidth / 2, footerY, { align: 'center' });
      pdf.text(`Documento generado electrónicamente · N° ${d.numero || ''} · AMBIÉNTATE`, pageWidth / 2, footerY + 4, { align: 'center' });

      pdf.save(`${d.numero || 'documento'}-${(d.clienteNombre || 'cliente').replace(/[^a-zA-Z0-9]/g, '_')}.pdf`);
      toast('📄 PDF generado y descargado');
      return;
    } catch(err) {
      console.warn('Error jsPDF:', err);
    }
  }
  imprimirDocumentoHTML(docId);
}

function compartirWhatsApp(docId) {
  const d = (S.documentos || []).find(x => x.id === docId);
  if (!d) return;
  const c = cliente(d.clienteId);
  const tel = ((c && c.telefono) || "").replace(/\D/g, "");
  if (!tel) { toast("El cliente no tiene teléfono guardado"); return; }
  const tipoNombre = (TIPO_DOC[d.tipo] ? TIPO_DOC[d.tipo][1] : d.tipo);
  const totalStr = EUR(d.total != null ? d.total : d.importe);
  const msg = `Hola *${c ? c.negocio : d.clienteNombre}*, le enviamos el justificante de *${tipoNombre} N° ${d.numero || ""}* por importe de *${totalStr}* emitida con fecha ${fmtDate(d.fecha)}. ¡Muchas gracias!`;
  window.open(`https://wa.me/34${tel}?text=${encodeURIComponent(msg)}`, '_blank');
}

function crearRectificativa(docId) {
  const orig = (S.documentos || []).find(d => d.id === docId);
  if (!orig) return;
  const c = cliente(orig.clienteId);
  const origTotal = orig.total != null ? orig.total : orig.importe;
  const isNota = c && c.notaTrabajo;
  const ivaPct = orig.ivaPct != null ? orig.ivaPct : (isNota ? 0 : 21);
  const origBase = orig.baseImponible != null ? orig.baseImponible : Math.round((origTotal / (1 + ivaPct / 100)) * 100) / 100;

  formSheet("Factura Rectificativa / Abono", [
    { k: "motivo", label: "Motivo de la rectificación", type: "text", val: "Abono de factura " + (orig.numero || "") },
    { k: "importeBase", label: "Base imponible a rectificar (€, en positivo)", type: "number", val: Math.abs(origBase) }
  ], vals => {
    if (!vals.importeBase || vals.importeBase <= 0) { toast("Indica importe de base imponible válido"); return; }
    const base = -Math.abs(parseFloat(vals.importeBase));
    const cuota = Math.round(base * (ivaPct / 100) * 100) / 100;
    const total = Math.round((base + cuota) * 100) / 100;
    const numero = siguienteNumero("rectificativa");

    const doc = {
      id: uid(),
      numero,
      tipo: "rectificativa",
      clienteId: orig.clienteId,
      clienteNombre: orig.clienteNombre,
      producto: vals.motivo,
      baseImponible: base,
      ivaPct,
      ivaCuota: cuota,
      importe: total,
      total,
      fecha: S.fecha,
      estado: "pagada",
      rectificaId: orig.id,
      rectificaNumero: orig.numero
    };
    (S.documentos = S.documentos || []).push(doc);
    save(); renderAdmin(); toast("🔄 Factura rectificativa " + numero + " emitida");
  });
}

function onPresetLineaChange(sel) {
  const inp = document.getElementById("df_linea_concepto");
  const pInp = document.getElementById("df_linea_precio");
  if (sel.value === "OTRO") {
    inp.style.display = "block";
    inp.value = "";
    inp.focus();
  } else {
    inp.style.display = "none";
    inp.value = sel.value;
    if (sel.value.includes("Stand")) pInp.value = 45;
    else if (sel.value.includes("caja 25")) pInp.value = 93.75;
    else if (sel.value.includes("Turbo")) pInp.value = 15;
  }
}

function anadirLineaFactura(tipoDoc, clienteId) {
  const sel = document.getElementById("df_linea_preset");
  const customInp = document.getElementById("df_linea_concepto");
  const cantInp = document.getElementById("df_linea_cant");
  const precioInp = document.getElementById("df_linea_precio");

  const concepto = (sel.value === "OTRO" ? customInp.value : sel.value).trim();
  const cantidad = parseFloat(cantInp.value) || 1;
  const precioUnit = parseFloat(precioInp.value) || 0;

  if (!concepto) { toast("Escribe la descripción del producto o servicio"); return; }
  if (precioUnit <= 0) { toast("Indica un precio unitario válido"); return; }

  docLinesDraft.push({ concepto, cantidad, precioUnit });
  drawCreadorFacturaSheet(tipoDoc, clienteId);
}

function quitarLineaFactura(idx, tipoDoc, clienteId) {
  docLinesDraft.splice(idx, 1);
  drawCreadorFacturaSheet(tipoDoc, clienteId);
}

function emitirDocumentoMultiLinea(tipoDoc, clienteId) {
  const c = cliente(clienteId);
  if (!c) { toast("Selecciona un cliente"); return; }
  if (!docLinesDraft.length) { toast("Añade al menos una línea de producto o servicio"); return; }

  let baseTotal = 0;
  docLinesDraft.forEach(l => {
    baseTotal += (l.cantidad || 1) * (l.precioUnit || 0);
  });
  baseTotal = Math.round(baseTotal * 100) / 100;

  const ivaPct = parseInt(document.getElementById("df_ivaPct").value || "21", 10);
  const cuotaIva = Math.round(baseTotal * (ivaPct / 100) * 100) / 100;
  const totalDoc = Math.round((baseTotal + cuotaIva) * 100) / 100;
  const numero = siguienteNumero(tipoDoc);

  const productoResumen = docLinesDraft.map(l => `${l.cantidad}× ${l.concepto}`).join(", ");

  const doc = {
    id: uid(),
    numero,
    tipo: tipoDoc,
    clienteId: c.id,
    clienteNombre: c.negocio,
    producto: productoResumen,
    lineas: [...docLinesDraft],
    baseImponible: baseTotal,
    ivaPct,
    ivaCuota: cuotaIva,
    importe: totalDoc,
    total: totalDoc,
    fecha: S.fecha,
    estado: tipoDoc === "presupuesto" ? "pendiente" : "emitida",
    cobrado: 0
  };

  (S.documentos = S.documentos || []).push(doc);
  save();
  closeSheet();
  renderAdmin();
  toast(`✓ ${(TIPO_DOC[tipoDoc] ? TIPO_DOC[tipoDoc][1] : tipoDoc)} ${numero} emitida (${EUR(totalDoc)})`);
}

  const f=facturasFiltro; const opt=(v,t,sel)=>`<option value="${v}" ${v===sel?"selected":""}>${t}</option>`;

function nuevoDocumentoManual(tipo, preselectedCid){
  if(!S.clientes || !S.clientes.length){ toast("Crea primero un cliente en la pestaña Clientes"); return; }
  const titulos = {
    factura: "Nueva Factura",
    presupuesto: "Nuevo Presupuesto",
    albaran: "Nuevo Albarán / Nota de entrega"
  };
  const selCid = preselectedCid || (S.clientes[0] ? S.clientes[0].id : "");
  const cSel = cliente(selCid) || S.clientes[0];

  formSheet(titulos[tipo] || "Nuevo documento", [
    { k: "clienteId", label: "Cliente", type: "select", val: cSel.id, options: S.clientes.map(c => ({ v: c.id, t: c.negocio + (c.direccion ? " (" + c.direccion + ")" : "") })) },
    { k: "concepto", label: "Concepto / Descripción libre del servicio o venta", type: "text", val: tipo === "presupuesto" ? "Servicio de aromatización y mantenimiento" : "Servicio de aromatización cuota mensual" },
    { k: "baseImponible", label: "Base imponible (€, sin IVA)", type: "number", val: cSel.importe || 30 },
    { k: "ivaPct", label: "Tipo de IVA", type: "select", val: cSel.notaTrabajo ? "0" : "21", options: [{ v: "21", t: "21% IVA General" }, { v: "0", t: "0% Sin IVA (Nota de trabajo / Exento)" }] }
  ], vals => {
    const c = cliente(vals.clienteId);
    if (!c) { toast("Selecciona un cliente válido"); return; }
    const base = parseFloat(vals.baseImponible);
    if (isNaN(base) || base <= 0) { toast("Indica un importe de Base Imponible válido"); return; }

    const conceptoText = (vals.concepto || "").trim() || "Servicio de aromatización";
    const ivaPct = parseInt(vals.ivaPct || "21", 10);
    const ivaCuota = Math.round(base * (ivaPct / 100) * 100) / 100;
    const total = Math.round((base + ivaCuota) * 100) / 100;
    const numero = siguienteNumero(tipo);

    const doc = {
      id: uid(),
      numero,
      tipo,
      clienteId: c.id,
      clienteNombre: c.negocio,
      producto: conceptoText,
      baseImponible: base,
      ivaPct,
      ivaCuota,
      importe: total,
      total,
      fecha: S.fecha,
      estado: tipo === "presupuesto" ? "pendiente" : "emitida",
      cobrado: 0
    };

    (S.documentos = S.documentos || []).push(doc);
    save();
    renderAdmin();
    toast(`✓ ${(TIPO_DOC[tipo] ? TIPO_DOC[tipo][1] : tipo)} ${numero} emitida (${EUR(total)})`);
  });
}

function moverClienteEnRuta(cid, dir){
  const c=cliente(cid); if(!c) return; const rutaId=c.rutaId;
  const positions=[]; S.clientes.forEach((x,i)=>{ if(x.rutaId===rutaId) positions.push(i); });
  const subseq = positions.map(i=>S.clientes[i]);
  const pos = subseq.findIndex(x=>x.id===cid); const dest = pos+dir;
  if(pos<0||dest<0||dest>=subseq.length) return;
  const tmp=subseq[pos]; subseq[pos]=subseq[dest]; subseq[dest]=tmp;
  positions.forEach((absIdx,k)=>{ S.clientes[absIdx]=subseq[k]; });
  save(); renderAdmin();
}

function setInvFiltro(k,v){
  invFiltro[k]=v;

    const container = document.getElementById("inv_rows_container");
    if(container){

      container.innerHTML = filas.length ? filas.map(x=>`<div class="row"><div class="ri">🔌</div>

        : `<div class="empty">Sin resultados</div>`;
      return;
    }
  }
  drawInventario();

function inventarioFilas(){
  const rows=[];
  S.clientes.forEach(c=>{ if(c.activo===false) return;
    const r=S.rutas.find(x=>x.id===c.rutaId); const tec=r?tecnico(r.tecnicoId):null;
    clienteDisps(c).forEach(tipo=>rows.push({cliente:c.negocio, ruta:r?r.nombre:"—", rutaId:c.rutaId,
      tecnico:tec?tec.nombre:"—", tecnicoId:r?r.tecnicoId:"", modelo:disp(tipo).label, modeloId:tipo, fecha:c.fechaAlta||""}));
  });
  const f=invFiltro;
  return rows.filter(x=> (!f.rutaId||x.rutaId===f.rutaId) && (!f.modelo||x.modeloId===f.modelo)
    && (!f.tecnicoId||x.tecnicoId===f.tecnicoId) && (!f.cliente||x.cliente.toLowerCase().includes(f.cliente.toLowerCase()))
    && (!f.fecha||x.fecha===f.fecha));
}

function editDifusor(id){
  const list=DISPOSITIVOS_(); const d=id?list.find(x=>x.id===id):null;
  formSheet(d?"Editar modelo":"Nuevo modelo de difusor",[
    {k:"id",label:"Código (único)",val:d?d.id:"",ph:"NEBU 3"},
    {k:"label",label:"Nombre",val:d?d.label:"",ph:"Nebu 3"},
    {k:"unidad",label:"Unidad de consumo",type:"select",val:d?d.unidad:"ml",options:[{v:"ml",t:"Mililitros (nebulización)"},{v:"bote",t:"Bote"}]},
    {k:"cantidad",label:"Consumo por servicio",type:"number",val:d?d.cantidad:150},
    {k:"precio",label:"Precio instalación (€, sin IVA)",type:"number",val:d?d.precio:0},
  ],vals=>{

function admTecnicos(){
  const mesActual = S.fecha.slice(0,7);
  const cards = S.tecnicos.map(t=>{
    const nRutas = S.rutas.filter(r=>r.tecnicoId===t.id).length;
    const est = estadoTecnico(t);
    const horasMes = (S.fichajes||[]).filter(x=>x.tecnicoId===t.id && x.fecha.slice(0,7)===mesActual && x.horaFin)
      .reduce((s,x)=>s+horasDecimal(x.horaInicio,x.horaFin),0);
    const objetivo = t.horasMensuales||160;
    const diffHoras = horasMes-objetivo;
    let asignadas=0, hechas=0, ausencias=0;
    Object.values(S.jornadas).forEach(j=>{
      if(j.tecnicoId!==t.id || j.fecha.slice(0,7)!==mesActual) return;
      j.visitas.forEach(v=>{
        if(v.estado==="programada") return;
        asignadas++;
        if(v.estado==="hecho"||v.estado==="cerrado") hechas++;
        if(v.estado==="ausente") ausencias++;
      });
    });
    const productividad = asignadas>0 ? Math.round(hechas/asignadas*100) : null;
    return `<div class="tec-card">
      <div class="fc-block-h">${ic('hardhat',16)}<h4>${esc(t.nombre)}</h4>
        <button class="rx" onclick="editTecnico('${t.id}')">${ic('pencil',14)}</button>
        <button class="rx" onclick="delTecnico('${t.id}')">${ic('trash',14)}</button></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px"><span class="mtag ${est.cls}">${est.label}</span>${t.rol&&t.rol!=='tecnico'?`<span class="mtag mt-neutral">${t.rol==='gerente'?'Gerente':'Administrativo'}</span>`:""}</div>
      <div class="fc-grid">
        <div class="fc-stat"><div class="fc-stat-n">${horasMes.toFixed(1)} h</div><div class="fc-stat-l">Horas este mes (obj. ${objetivo}h)</div></div>
        <div class="fc-stat"><div class="fc-stat-n" style="color:${diffHoras>=0?'var(--good)':'var(--crit)'}">${diffHoras>=0?"+":""}${diffHoras.toFixed(1)} h</div><div class="fc-stat-l">${diffHoras>=0?"Horas a favor":"Horas pendientes"}</div></div>
        <div class="fc-stat"><div class="fc-stat-n">${productividad==null?"—":productividad+"%"}</div><div class="fc-stat-l">Productividad</div></div>
        <div class="fc-stat"><div class="fc-stat-n">${ausencias}</div><div class="fc-stat-l">Ausencias este mes</div></div>
        <div class="fc-stat"><div class="fc-stat-n">${nRutas}</div><div class="fc-stat-l">${nRutas===1?"Ruta asignada":"Rutas asignadas"}</div></div>
      </div>
      <div class="rd" style="margin-top:8px">${t.tel||"—"}</div>
      <button class="mtag mt-acc" style="margin-top:8px" onclick="verFichajesTecnico('${t.id}')">${ic('clock',12)} Ver fichajes</button>
    </div>`;
  }).join("")||`<div class="empty">Sin técnicos</div>`;
  const pendientes = (S.solicitudes||[]).filter(s=>s.estado==="pendiente");
  const solRows = (S.solicitudes||[]).slice().sort((a,b)=>b.creada.localeCompare(a.creada)).map(s=>{ const t=tecnico(s.tecnicoId);
    const badge={pendiente:'<span class="mtag mt-warn">Pendiente</span>',aprobada:'<span class="mtag mt-good">Aprobada</span>',rechazada:'<span class="mtag mt-crit">Rechazada</span>'};
    return `<div class="row"><div class="ri">${s.tipo==="vacaciones"?"🏖️":s.tipo==="baja"?"🏥":"📋"}</div>
      <div class="rm"><div class="rn">${esc(t?t.nombre:"—")} · ${TIPO_LICENCIA[s.tipo]}</div><div class="rd">${fmtDate(s.fechaInicio)} → ${fmtDate(s.fechaFin)}${s.nota?" · "+esc(s.nota):""}</div></div>
      ${s.estado==="pendiente"?`<button class="mtag mt-good" onclick="resolverSolicitud('${s.id}','aprobada')">Aprobar</button><button class="mtag mt-crit" onclick="resolverSolicitud('${s.id}','rechazada')">Rechazar</button>`:badge[s.estado]}</div>`;
  }).join("");
  return `<div class="tec-cards-grid">${cards}</div>
    <button class="addbtn" onclick="editTecnico()">+ Nuevo técnico</button>
    <div class="sec-t">Vacaciones / asuntos propios / bajas <span class="cnt">${pendientes.length} pendientes</span></div>
    ${solRows||`<div class="empty" style="padding:16px">Sin solicitudes.</div>`}`;

function rangoContable(tipo){
  const hoy=S.fecha;
  if(tipo==="mesAnt"){ return mesAnteriorRango(hoy); }
  if(tipo==="trimestre"){ const m=parseInt(hoy.slice(5,7),10); const q0=Math.floor((m-1)/3)*3+1; const y=hoy.slice(0,4);
    return [`${y}-${String(q0).padStart(2,"0")}-01`, hoy]; }
  if(tipo==="anio"){ return [hoy.slice(0,4)+"-01-01", hoy]; }
  return [inicioMes(hoy), hoy]; // "mes"
}

// datos comunes del balance, usados tanto por el CSV como por la vista PDF
function datosBalance(){
  const [desde,hasta]=rangoContable(contabPeriodo);
  const docs=(S.documentos||[]).filter(d=>esFacturable(d)&&d.fecha>=desde&&d.fecha<=hasta);
  const cobrado=docs.reduce((s,d)=>{ const t=(d.total!=null?d.total:d.importe)||0; const st=estadoFactura(d);
    return s+(st==="pagada"?t:(st==="parcial"?(d.cobrado||0):0)); },0);
  // pendiente de cobro = derechos de cobro frente a clientes (activo circulante)
  const pendienteCobro=(S.documentos||[]).filter(d=>esFacturable(d)&&["pendiente","emitida","vencida","parcial"].includes(estadoFactura(d)))
    .reduce((s,d)=>{ const t=(d.total!=null?d.total:d.importe)||0; return s+(t-(d.cobrado||0)); },0);
  // existencias: stock de difusores valorado a su precio de instalación
  const existencias=DISPOSITIVOS_().reduce((s,d)=>s+(((S.stockDifusores||{})[d.id]||0)*(d.precio||0)),0);
  const gastos=(S.gastos||[]).filter(g=>g.fecha>=desde&&g.fecha<=hasta).reduce((s,g)=>s+(g.importe||0),0);
  const ingresos=docs.reduce((s,d)=>s+((d.total!=null?d.total:d.importe)||0),0);
  const tesoreria=cobrado-gastos;
  const activo=tesoreria+pendienteCobro+existencias;
  const resultado=ingresos-gastos;
  return {desde,hasta,tesoreria,pendienteCobro,existencias,activo,resultado,patrimonio:activo-resultado,ingresos,gastos};
}
function exportBalance(){

    ["PASIVO Y PATRIMONIO NETO"],["Resultado del periodo",b.resultado],["Fondos propios (resto)",b.patrimonio],["TOTAL PASIVO",b.activo],[],
    ["Nota","Balance operativo simplificado. No contempla inmovilizado, deudas con terceros ni amortizaciones."]];

}

let accesosDesbloqueados = false;

function detectDispositivo(){
  const ua = navigator.userAgent;
  let os = "Dispositivo Web";
  if (/iPhone|iPad|iPod/i.test(ua)) os = "📱 iPhone / iPad (iOS)";
  else if (/Android/i.test(ua)) os = "📱 Teléfono Android";
  else if (/Macintosh|Mac OS X/i.test(ua)) os = "💻 Mac (macOS)";
  else if (/Windows/i.test(ua)) os = "💻 PC Windows";

  let browser = "";
  if (/Chrome|CriOS/i.test(ua)) browser = "Chrome";
  else if (/Safari/i.test(ua) && !/Chrome/i.test(ua)) browser = "Safari";
  else if (/Firefox/i.test(ua)) browser = "Firefox";
  else if (/Edg/i.test(ua)) browser = "Edge";

  return browser ? `${os} · ${browser}` : os;
}

    fechaIso: now.toISOString(),
    fechaHora: fechaHora,
    rol: role,
    usuario: usuarioNombre,
    dispositivo: detectDispositivo(),
    ubicacion: "Detectando ciudad / IP..."
  };

  S.accesos.unshift(nuevoAcceso);
  if(S.accesos.length > 200) S.accesos = S.accesos.slice(0, 200);
  save();

  fetch("https://ipapi.co/json/")
    .then(r => r.json())
    .then(data => {
      if(data && (data.city || data.country_name || data.ip)){
        nuevoAcceso.ubicacion = `${data.city || ""}${data.city && data.country_name ? ", " : ""}${data.country_name || ""} (${data.ip || ""})`.trim();
        save();
        if(admTab === "datos" && accesosDesbloqueados) renderAdmin();
      }
    })
    .catch(() => {
      nuevoAcceso.ubicacion = "Acceso Web (IP reservada)";
      save();
    });
}

function formSheet(title, fields, onSave){
  const sh = document.getElementById("sheet");

        return `<label class="mini-lbl">${f.label}</label><select class="fld-inp" id="fld_${f.k}">${f.options.map(o=>`<option value="${o.v}" ${String(o.v)===String(f.val)?"selected":""}>${o.t}</option>`).join("")}</select>`;
      }
      return `<label class="mini-lbl">${f.label}</label><input class="fld-inp" id="fld_${f.k}" type="${f.type||'text'}" inputmode="${f.type==='number'?'decimal':'text'}" value="${f.val??''}" placeholder="${f.ph||''}">`;
    }).join("")}
    <button class="cta" onclick="__saveForm()">Guardar</button>

function editCliente(id){

  cliDraft={ id:c?c.id:null, negocio:c?c.negocio:"", sector:c?c.sector:(S.sectores[0]||""), direccion:c?c.direccion:"",

    formaHabitual:c?c.formaHabitual:"efectivo", banco:c&&c.banco?{...c.banco}:{iban:"",titular:c?c.negocio:""},

// vista previa de consumo a partir de contadores {id:n}
function consumoPreviewCounts(counts, aroma){
  const map={};
  Object.keys(counts).forEach(id=>{ const n=counts[id]; if(!n) return; const x=disp(id);
    const prod=x.bacterio?"Bacteriostático":(aroma||"—"); (map[prod]=map[prod]||{ml:0,bote:0})[x.unidad]+=x.cantidad*n; });
  const keys=Object.keys(map); if(!keys.length) return "—";
  return keys.map(k=>fmtConsumo(map[k])+" de "+k).join(" + ");
}
// coloca (o mueve) un cliente en la posición indicada dentro de su ruta, sin alterar el resto
// sugiere una ruta a partir del municipio/dirección escritos, comparando con el municipio guardado en cada ruta
function normTxt(s){ return (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim(); }
function sugerirRutaPorDireccion(municipio, direccion){
  const m=normTxt(municipio), d=normTxt(direccion);
  if(!m && !d) return null;
  const rutasConMuni = S.rutas.filter(r=>r.municipio);
  let match = rutasConMuni.find(r=>normTxt(r.municipio)===m);
  if(match) return match.id;
  match = rutasConMuni.find(r=>{ const rm=normTxt(r.municipio); return m && (m.includes(rm)||rm.includes(m)); });
  if(match) return match.id;
  match = rutasConMuni.find(r=>d.includes(normTxt(r.municipio)));
  return match?match.id:null;
}

function onDireccionClienteChange(){

function colocarClienteEnRuta(c, posIndex){
  S.clientes = S.clientes.filter(x=>x.id!==c.id);
  const mismos = S.clientes.filter(x=>x.rutaId===c.rutaId);
  if(!mismos.length || posIndex>=mismos.length){
    if(mismos.length){ S.clientes.splice(S.clientes.indexOf(mismos[mismos.length-1])+1,0,c); }
    else S.clientes.push(c);
  } else {
    S.clientes.splice(S.clientes.indexOf(mismos[posIndex]),0,c);
  }
}
function saveCli(){
  captureCli(); const d=cliDraft;
  if(!d.negocio.trim()){ toast("Indica el nombre del negocio"); return; }
  const dispositivos=[]; DISPOSITIVOS_().forEach(x=>{ for(let i=0;i<(d.counts[x.id]||0);i++) dispositivos.push(x.id); });
  const importe = importeBase({dispositivos, descuentoPct:d.descuentoPct});
  const data={negocio:d.negocio.trim(), sector:d.sector, direccion:d.direccion, email:d.email||"", telefono:d.telefono||"", cp:d.cp, municipio:d.municipio, provincia:d.provincia,
    descuentoPct:d.descuentoPct, notaTrabajo:d.notaTrabajo, importe, formaHabitual:d.formaHabitual,
    banco: d.formaHabitual==="domiciliacion" ? {...d.banco} : undefined,
    aroma:d.aroma, rutaId:d.rutaId, dispositivos};
  if(d.id){
    const c=cliente(d.id); Object.assign(c,data); delete c.dispositivo; if(!data.banco) delete c.banco;
    colocarClienteEnRuta(c, d.posicion);
    save(); closeSheet(); renderAll(); toast("✓ Cliente guardado"); return;
  }
  // cliente NUEVO: se crea en la posición elegida, se incorpora a la ruta de hoy y se ofrece presupuesto/factura
  const nuevoId=uid();
  const nuevo={id:nuevoId,activo:true,fechaAlta:S.fecha,lat:null,lng:null,contrato:{estado:"nuevo"},...data};
  S.clientes.push(nuevo); colocarClienteEnRuta(nuevo, d.posicion);
  const j=getJornada(S.fecha, data.rutaId);
  if(j && !j.cerrada && !j.visitas.some(v=>v.clienteId===nuevoId)){
    const v=newVisita(nuevoId,"programada",false,999); v.anadida=true; j.visitas.push(v); // en la ruta de hoy: al final; se reordena arrastrando
  }
  // si lo da de alta un técnico, el admin recibe una tarea para supervisarlo (el técnico ya puede facturar sin esperar)
  if(S.session && S.session.role==="tecnico"){ tareaClienteNuevo(nuevoId, S.session.tecnicoId, data.rutaId); }
  save(); renderAll();
  trasNuevoCliente(nuevoId);
}

const eurPlano = n => String(Math.round((n||0)*100)/100).replace(".",",");
function descargarCSV(nombre, filas){
  const sep=";"; const q=v=>{ v=String(v==null?"":v); return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const csv=filas.map(f=>f.map(q).join(sep)).join("\r\n");
  const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=nombre; a.click();
  toast("📄 Informe descargado");
}
function jornadasDe(fecha, rutaId){ return rutaId ? [getJornada(fecha,rutaId)] : S.rutas.map(r=>getJornada(fecha,r.id)); }
function informeIngresosGastos(fecha, rutaId){

    ["Ruta","Cliente","Cobro (€)","Forma","Venta adic. (€)"]];
  let ef=0,ba=0,pe=0,ven=0;
  js.forEach(j=>{ const r=S.rutas.find(x=>x.id===j.rutaId);
    j.visitas.forEach(v=>{ if(v.estado!=="realizada") return; const c=cliente(v.clienteId);
      const imp=v.cobro?v.cobro.importe:0, f=v.cobro?v.cobro.forma:"";
      if(f==="efectivo")ef+=imp; else if(f==="domiciliacion")ba+=imp; else pe+=imp;
      const va=v.ventaAdic?v.ventaAdic.importe:0; ven+=va;
      filas.push([r?r.nombre:"", c?c.negocio:"", eurPlano(imp), f, va?eurPlano(va):""]);

  });
  const tecIds=new Set(js.map(j=>j.tecnicoId));
  const gastos=(S.gastos||[]).filter(g=>g.fecha===fecha && (!rutaId || tecIds.has(g.tecnicoId)));
  let tg=0;
  filas.push([],["GASTOS EN EFECTIVO"],["Negocio","Concepto","Importe (€)","Técnico"]);
  gastos.forEach(g=>{ tg+=g.importe||0; filas.push([g.negocio,g.concepto,eurPlano(g.importe),(tecnico(g.tecnicoId)||{}).nombre||""]); });
  filas.push([],["RESUMEN"],
    ["Efectivo cobrado",eurPlano(ef)],["Domiciliación",eurPlano(ba)],["Pendiente de cobro",eurPlano(pe)],
    ["Ventas adicionales",eurPlano(ven)],["Total gastos efectivo",eurPlano(tg)],

  descargarCSV(`ingresos-gastos-${fecha}${rutaId?"-"+((S.rutas.find(r=>r.id===rutaId)||{}).nombre||""):""}.csv`, filas);
}

function splitLine(line,d){
  const out=[]; let cur="",q=false;
  for(let i=0;i<line.length;i++){ const ch=line[i];
    if(q){ if(ch==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else { if(ch==='"') q=true; else if(ch===d){ out.push(cur); cur=""; } else cur+=ch; } }
  out.push(cur); return out;
}
function parseCSV(text){
  text = text.replace(/^﻿/,"");
  const lines = text.split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length) return [];
  const semis=(lines[0].match(/;/g)||[]).length, commas=(lines[0].match(/,/g)||[]).length;
  const d = semis>=commas ? ";" : ",";
  const headers = splitLine(lines[0],d).map(h=>h.trim().toLowerCase().replace(/[áàä]/g,"a").replace(/[éèë]/g,"e").replace(/[íìï]/g,"i").replace(/[óòö]/g,"o").replace(/[úùü]/g,"u"));
  return lines.slice(1).map(l=>{ const cells=splitLine(l,d); const o={}; headers.forEach((h,i)=>o[h]=(cells[i]||"").trim()); return o; });
}
function normForma(v){
  v=(v||"").toLowerCase().trim();
  if(v.startsWith("efect")||v.startsWith("cash")||v.startsWith("metal")) return "efectivo";
  if(v.startsWith("banc")||v.startsWith("domic")||v.startsWith("bank")||v.startsWith("recib")) return "domiciliacion";
  if(v.startsWith("pend")) return "pendiente";
  return "efectivo";
}
function normAroma(v){
  v=(v||"").trim(); if(!v) return S.aromas[0]||"";
  const found = S.aromas.find(a=>a.toLowerCase()===v.toLowerCase()); return found||v;
}
function normDisp(v){
  v=(v||"").trim().toUpperCase().replace(",",".").replace(/\s+/g," ");
  if(v.startsWith("BACTERIO")) return "BACTERIOSTATICO 1";
  const found = DISPOSITIVOS_().find(d=>d.id===v || d.id.replace(".","")===v.replace(".",""));
  return found?found.id:"NEBU 2";
}
function importClientesCSV(inp){

    let added=0, updated=0, rutasNew=0;

      const dispositivos=(row.dispositivo||"NEBU 2").split(",").map(x=>x.trim()).filter(Boolean).map(normDisp);
      const datos={negocio,sector:row.sector||"",direccion:row.direccion||"",importe,

        dispositivos:dispositivos.length?dispositivos:["NEBU 2"],rutaId:ruta.id};
      // si ya existe el mismo negocio en esa ruta -> actualizar; si no -> añadir
      const exist=S.clientes.find(c=>c.rutaId===ruta.id && c.negocio.toLowerCase()===negocio.toLowerCase());
      if(exist){ Object.assign(exist,datos); delete exist.dispositivo; updated++; }
      else { S.clientes.push({id:uid(),activo:true,...datos}); added++; }
    });
    save();
    if(!S.rutaSel) S.rutaSel=S.rutas[0]?.id;
    renderAll();
    toast(`✓ ${added} nuevos · ${updated} actualizados${rutasNew?` · ${rutasNew} rutas nuevas`:""}`);
  };
  r.readAsText(f,"UTF-8");
}
function resetDemo(){ askConfirm("¿Reiniciar con los datos demo? Se perderán tus cambios.", ()=>{ S=seed(); save(); renderAll(); switchTab("Admin"); toast("Datos demo restaurados"); }, true); }
function wipe(){ askConfirm("¿Borrar TODOS los datos? No se puede deshacer.", ()=>{ localStorage.removeItem(LS_KEY); S=seed(); save(); renderAll(); toast("Todo borrado"); }, true); }

/* ---- perfil / sesión ---- */
function renderLogin(){
  const wrap = document.getElementById("loginRoles");
  let html = `<button class="login-btn admin" onclick="pedirClave('admin')">
      <span>${ICON_ADMIN}</span><div><b>Administrador</b><small>Alta de clientes, rutas, técnicos e informes</small></div></button>
    <div class="login-sep">Técnicos de ruta</div>`;
  html += S.tecnicos.length? S.tecnicos.map(t=>{
    const rs = S.rutas.filter(r=>r.tecnicoId===t.id).map(r=>r.nombre).join(" · ");
    return `<button class="login-btn" onclick="pedirClave('tecnico','${t.id}')">
      <span class="av2">${inits(t.nombre)}</span><div><b>${t.nombre}</b><small>${rs||"Sin rutas asignadas"}</small></div></button>`;
  }).join("") : `<div class="empty" style="padding:16px">Aún no hay técnicos. Entra como administrador para crearlos.</div>`;
  wrap.innerHTML = html;
}
function showLogin(){
  const card=document.querySelector(".login-card");
  card.innerHTML=`<img class="login-logo" src="logo.png" alt="AMBIÉNTATE"><p>¿Quién va a usar la app?</p><div id="loginRoles"></div>`;
  renderLogin();
  document.getElementById("login").classList.remove("hidden");
}
function pedirClave(role, tecnicoId){
  const nombre = role==="admin" ? "Administrador" : (tecnico(tecnicoId)?tecnico(tecnicoId).nombre:"");
  const card=document.querySelector(".login-card");
  card.innerHTML=`<img class="login-logo" src="logo.png" alt="AMBIÉNTATE"><p>Hola, <b>${esc(nombre)}</b> · introduce tu clave</p>
    <input class="fld-inp" id="loginPin" type="password" inputmode="numeric" placeholder="Contraseña"
      style="text-align:center;font-size:22px;letter-spacing:6px" onkeydown="if(event.key==='Enter')validarClave('${role}','${tecnicoId||''}')">
    <div id="loginErr" style="color:var(--crit);font-size:13px;font-weight:600;height:18px;margin:8px 0"></div>
    <button class="cta" onclick="validarClave('${role}','${tecnicoId||''}')">Entrar</button>
    <button class="cta ghost" onclick="showLogin()">← Volver</button>`;
  setTimeout(()=>{ const el=document.getElementById("loginPin"); if(el) el.focus(); },60);
}
function validarClave(role, tecnicoId){
  const pin=(document.getElementById("loginPin").value||"").trim();
  const ok = role==="admin" ? pin===(S.adminClave||"0000")
    : (tecnico(tecnicoId) && pin===(tecnico(tecnicoId).clave||""));
  if(!ok){ const e=document.getElementById("loginErr"); if(e) e.textContent="Contraseña incorrecta"; return; }
  doLogin(role, tecnicoId||null);
}
function doLogin(role, tecnicoId){
  S.session = {role, tecnicoId: tecnicoId||null};
  regAcceso(role, tecnicoId||null);
  const rs = availableRutas();
  if(!rs.find(r=>r.id===S.rutaSel)) S.rutaSel = rs[0] ? rs[0].id : null;
  save();
  document.getElementById("login").classList.add("hidden");
  renderAll();
  // el admin CONTROLA (aterriza en su panel), el técnico EJECUTA (aterriza en la ruta del día)
  if(role==="admin"){ admTab="dashboard"; switchTab("Admin"); }
  else switchTab("Inicio");
  toast(role==="admin"?"Modo administrador":(tecnico(tecnicoId)?tecnico(tecnicoId).nombre:""));
}
function logout(){ closeSheet(); showLogin(); }
function applyRole(){
  // el admin CONTROLA (Admin + Histórico); el técnico EJECUTA (Ruta de hoy · Clientes · Histórico · Gastos · Jornada)
  const admin = isAdmin();
  document.body.classList.toggle("role-admin", admin);
  document.body.classList.toggle("role-tecnico", !admin);
  const tabVis = {Admin:admin, Gastos:!admin, Inicio:!admin, Caja:!admin, Clientes:!admin, Historico:true};
  Object.keys(tabVis).forEach(name=>{
    const t = document.querySelector('.tab[data-tab="'+name+'"]');
    if(t) t.style.display = tabVis[name] ? "" : "none";
  });
  if(!admin && currentTab==="Admin") switchTab("Inicio");
  if(admin && (currentTab==="Gastos"||currentTab==="Inicio"||currentTab==="Caja"||currentTab==="Clientes")) switchTab("Admin");
}

/* ---- navegación ---- */
function switchTab(name){
  if(name==="Admin" && !isAdmin()){ pedirClave('admin'); return; }
  if((name==="Gastos"||name==="Clientes") && isAdmin()){ name="Admin"; }
  if((name==="Inicio"||name==="Caja") && isAdmin()){ name="Admin"; } // el admin no ejecuta rutas
  currentTab=name;
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.tab===name));
  ["Inicio","Clientes","Caja","Historico","Gastos","Admin"].forEach(v=>document.getElementById("view"+v).classList.toggle("hidden",v!==name));
  const titles={Inicio:currentRuta()?currentRuta().nombre:"AMBIÉNTATE",Clientes:"Clientes",Caja:"Jornada laboral",Historico:"Histórico",Gastos:"Gastos",Admin:"Administración"};
  tbSet(titles[name]);
  document.getElementById("rtpickWrap").style.display = (name==="Inicio")?"flex":"none";
  const sc = document.querySelector("#app main:not(.hidden)"); if(sc) sc.scrollTop=0;
  window.scrollTo(0,0);
  if(name==="Clientes") renderClientesTecnico();
  if(name==="Caja") renderJornadaLaboral();
  if(name==="Admin") renderAdmin();
}

/* ---- toast ---- */
let toastT;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2200); }

/* ---- eventos ---- */
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>switchTab(t.dataset.tab)));
document.getElementById("rutaSel").addEventListener("change",e=>{ S.rutaSel=e.target.value; save(); renderAll(); tbSet(currentRuta().nombre); });
document.getElementById("sheetBg").addEventListener("click",closeSheet);
// Accesibilidad: cerrar el modal con la tecla Escape cuando está abierto
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && document.getElementById("sheet").classList.contains("open")) closeSheet(); });
document.getElementById("tbAv").addEventListener("click",logout);
// guardar estado si se minimiza / cierra la app (PWA en segundo plano)
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){ save(); }
  else if(S.session){ // al volver a la app, comprueba si hay que cerrar un día pasado
    if(autoCloseCheck()){ renderAll(); toast("🌙 Día anterior cerrado automáticamente"); }
  }
});
window.addEventListener("pagehide", save);
window.addEventListener("beforeunload", save);

/* ---- init ---- */
// 1. Renderizado instantáneo (0 ms) con los datos locales para evitar pantalla fija en blanco
try {
  if(!S.fecha) S.fecha = todayISO();
  if(!S.rutaSel) S.rutaSel = S.rutas[0]?.id;
  autoCloseCheck();
  if(!S.session || !S.session.role){
    S.session = { role: "admin", tecnicoId: null };
  }
  renderAll();
  switchTab(S.session.role === "admin" ? "Admin" : "Inicio");
} catch(initErr) {
  console.error("Error en el render inicial:", initErr);
  S = seed();
  S.session = { role: "admin", tecnicoId: null };
  renderAll();
  switchTab("Admin");
}

// 2. Sincronización asíncrona con el servidor en segundo plano (sin bloquear la interfaz)
(async function syncAppWithServer() {
  try {
    const serverState = await loadFromServer();
    if (serverState) {
      const localSession = S.session;
      const localFecha = S.fecha;
      const localRutaSel = S.rutaSel;
      S = serverState;
      patchState(S);
      if (localSession && localSession.role) S.session = localSession;
      if (localFecha) S.fecha = localFecha;
      if (localRutaSel) S.rutaSel = localRutaSel;
      try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e) {}
      renderAll();
      switchTab(S.session.role === "admin" ? "Admin" : "Inicio");
      console.log('✓ Datos sincronizados con el servidor');
    }
  } catch(syncErr) {
    console.warn("Sincronización en segundo plano no completada:", syncErr);
  }
})();
</script>
